<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现场不合格报告 BI 分析</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0a0e27;
  --bg-secondary: #111638;
  --bg-card: #1a1f4e;
  --text-primary: #e8eaf6;
  --text-secondary: #9fa8da;
  --accent-blue: #4fc3f7;
  --accent-purple: #b388ff;
  --accent-green: #69f0ae;
  --accent-orange: #ffab40;
  --accent-red: #ff5252;
  --accent-cyan: #18ffff;
  --glow-blue: rgba(79, 195, 247, 0.3);
  --glow-purple: rgba(179, 136, 255, 0.3);
}

body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse at 20% 50%, rgba(79, 195, 247, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(179, 136, 255, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(105, 240, 174, 0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ===== 头部 ===== */
.header {
  background: linear-gradient(135deg, #0d1137 0%, #1a237e 50%, #0d1137 100%);
  border-bottom: 1px solid rgba(79, 195, 247, 0.2);
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo { width: 56px; height: 56px; border-radius: 12px; object-fit: contain; background: #fff; padding: 4px; box-shadow: 0 0 20px var(--glow-blue); }
.header-title h1 { font-size: 24px; font-weight: 700; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
.header-title .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 1px; }
.header-right { display: flex; align-items: center; gap: 16px; }
.datetime { text-align: right; font-size: 13px; color: var(--text-secondary); }
.datetime .time { font-size: 20px; font-weight: 700; color: var(--accent-cyan); font-variant-numeric: tabular-nums; }

/* 头部工具栏按钮 */
.header-tools { display: flex; gap: 8px; }
.header-tools button {
  padding: 8px 16px; border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 8px;
  background: rgba(79, 195, 247, 0.08); color: var(--accent-blue);
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s;
  display: flex; align-items: center; gap: 6px;
}
.header-tools button:hover { background: rgba(79, 195, 247, 0.2); border-color: var(--accent-blue); }
.header-tools button.active { background: rgba(79, 195, 247, 0.25); border-color: var(--accent-blue); }

/* ===== 面包屑 + 看板切换栏 ===== */
.breadcrumb {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 48px;
  background: rgba(17, 22, 56, 0.95);
  border-bottom: 1px solid rgba(79, 195, 247, 0.1);
  padding: 0 24px;
  display: none; align-items: center; gap: 0;
}
.breadcrumb.show { display: flex; }
.breadcrumb .back-btn {
  padding: 10px 18px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.3s; white-space: nowrap; margin-right: 16px;
}
.breadcrumb .back-btn:hover { transform: translateX(-3px); box-shadow: 0 0 15px var(--glow-blue); }

/* 看板切换标签 */
.board-tabs { display: flex; gap: 0; flex: 1; overflow-x: auto; }
.board-tab {
  padding: 12px 18px; border: none; background: transparent;
  color: var(--text-secondary); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
  border-bottom: 2px solid transparent; position: relative;
}
.board-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
.board-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); font-weight: 600; }
.board-tab .tab-key { font-size: 10px; background: rgba(79, 195, 247, 0.15); color: var(--accent-blue); padding: 1px 5px; border-radius: 3px; margin-right: 6px; font-weight: 700; }

/* 全屏按钮 */
.fullscreen-btn {
  padding: 8px 14px; border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 6px;
  background: rgba(79, 195, 247, 0.08); color: var(--accent-blue);
  font-size: 16px; cursor: pointer; transition: all 0.3s; margin-left: 12px; white-space: nowrap;
}
.fullscreen-btn:hover { background: rgba(79, 195, 247, 0.2); }

/* ===== 主内容区 ===== */
.main-content { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 32px 32px; }

/* ===== KPI 概览区 ===== */
.kpi-overview {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px;
}
@media (max-width: 1024px) { .kpi-overview { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) { .kpi-overview { grid-template-columns: repeat(2, 1fr); } }

.kpi-item {
  background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 20px 16px; text-align: center;
  position: relative; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s;
}
.kpi-item:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.kpi-item::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-item:nth-child(1)::before { background: var(--accent-blue); }
.kpi-item:nth-child(2)::before { background: var(--accent-orange); }
.kpi-item:nth-child(3)::before { background: var(--accent-green); }
.kpi-item:nth-child(4)::before { background: var(--accent-red); }
.kpi-item:nth-child(5)::before { background: var(--accent-cyan); }
.kpi-item:nth-child(6)::before { background: var(--accent-purple); }
.kpi-icon { font-size: 24px; margin-bottom: 8px; }
.kpi-value { font-size: 32px; font-weight: 800; line-height: 1.1; }
.kpi-item:nth-child(1) .kpi-value { color: var(--accent-blue); }
.kpi-item:nth-child(2) .kpi-value { color: var(--accent-orange); }
.kpi-item:nth-child(3) .kpi-value { color: var(--accent-green); }
.kpi-item:nth-child(4) .kpi-value { color: var(--accent-red); }
.kpi-item:nth-child(5) .kpi-value { color: var(--accent-cyan); }
.kpi-item:nth-child(6) .kpi-value { color: var(--accent-purple); }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }
.kpi-trend { font-size: 11px; margin-top: 4px; font-weight: 600; }
.kpi-trend.down { color: var(--accent-green); }
.kpi-trend.up { color: var(--accent-red); }
.kpi-trend.flat { color: var(--text-secondary); }

/* ===== 欢迎区 ===== */
.welcome-section { text-align: center; margin-bottom: 28px; }
.welcome-section h2 { font-size: 18px; color: var(--text-secondary); font-weight: 400; }

/* ===== 卡片网格 ===== */
.dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 1024px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .dashboard-grid { grid-template-columns: 1fr; } }

/* ===== 看板卡片 ===== */
.dashboard-card {
  position: relative; background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px;
  padding: 28px 24px; cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
}
.dashboard-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-accent); opacity: 0.8; transition: height 0.3s; }
.dashboard-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 0%, var(--card-glow) 0%, transparent 70%); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
.dashboard-card:hover { transform: translateY(-6px) scale(1.02); border-color: var(--card-accent); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 30px var(--card-glow); }
.dashboard-card:hover::before { height: 4px; opacity: 1; }
.dashboard-card:hover::after { opacity: 1; }

.card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.card-icon { font-size: 36px; filter: drop-shadow(0 0 8px var(--card-glow)); }
.card-status {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap;
}
.card-status.ok { background: rgba(105, 240, 174, 0.15); color: var(--accent-green); }
.card-status.warn { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); }
.card-status.info { background: rgba(79, 195, 247, 0.15); color: var(--accent-blue); }

.card-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
.card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
.card-update { font-size: 11px; color: var(--text-secondary); opacity: 0.7; }
.card-shortcut { font-size: 11px; color: var(--text-secondary); opacity: 0.5; }
.card-shortcut kbd { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; }

.card-arrow { position: absolute; bottom: 16px; right: 16px; font-size: 16px; color: var(--text-secondary); opacity: 0; transform: translateX(-10px); transition: all 0.3s; }
.dashboard-card:hover .card-arrow { opacity: 1; transform: translateX(0); color: var(--card-accent); }

/* ===== Loading 动画 ===== */
.loading-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-primary); display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; z-index: 5;
}
.loading-overlay.show { display: flex; }
.loading-spinner {
  width: 40px; height: 40px; border: 3px solid rgba(79, 195, 247, 0.2);
  border-top-color: var(--accent-blue); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-secondary); }

/* ===== iframe 容器 ===== */
.iframe-container {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100; background: var(--bg-primary);
}
.iframe-container.show { display: block; }
.iframe-wrapper { position: relative; width: 100%; height: calc(100% - 48px); margin-top: 48px; }
.iframe-wrapper iframe { width: 100%; height: 100%; border: none; }

/* ===== 悬浮返回按钮 ===== */
.floating-back-btn {
  position: fixed; bottom: 30px; right: 30px; z-index: 1000;
  padding: 14px 28px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border: none; border-radius: 30px; color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 20px var(--glow-blue); transition: all 0.3s;
  display: none; align-items: center; gap: 8px;
}
.floating-back-btn.show { display: flex; }
.floating-back-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 30px var(--glow-blue); }

/* ===== 底部 ===== */
.footer {
  position: relative; z-index: 1; text-align: center; padding: 24px;
  color: var(--text-secondary); font-size: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 60px;
}

/* ===== 粒子动画 ===== */
.particles { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle { position: absolute; width: 2px; height: 2px; background: var(--accent-blue); border-radius: 50%; opacity: 0.3; animation: float linear infinite; }
@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
}

/* ===== 轮播指示器 ===== */
.carousel-indicator {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(17, 22, 56, 0.9); border: 1px solid rgba(79, 195, 247, 0.2);
  border-radius: 20px; padding: 8px 16px; display: none; align-items: center; gap: 12px;
  z-index: 1000; font-size: 12px; color: var(--text-secondary);
}
.carousel-indicator.show { display: flex; }
.carousel-indicator .progress-bar {
  width: 100px; height: 3px; background: rgba(79, 195, 247, 0.2); border-radius: 2px; overflow: hidden;
}
.carousel-indicator .progress-fill {
  height: 100%; background: var(--accent-blue); border-radius: 2px;
  animation: progress 30s linear infinite;
}
@keyframes progress { from { width: 0; } to { width: 100%; } }

</style>
</head>

    <div class="container">
        <div class="header">
            <h1>📊 现场不合格报告BI分析系统</h1>
            <p>总记录数：<span id="bh-totalRecords">0</span> 条</p>
        </div>

        <div class="toolbar">
            <button class="btn-import" onclick="document.getElementById('bh-fileInput').click()">📥 导入数据</button>
            <button class="btn-export" onclick="bh_exportData()">📤 导出Excel</button><button class="btn-export" onclick="bh_exportJS()" style="background: #764ba2; color: white;"> 导出JS数据</button>
            <button onclick="bh_exportStandaloneHTML()" style="background:#7209b7;">📦 导出独立HTML</button>
            <button class="btn-save" onclick="bh_saveToStorageBuhege();alert('数据已保存到浏览器！')" style="background: #10b981; color: white;">💾 保存数据</button>
            <button class="btn-reload" onclick="bh_reloadExternalData()" title="从外部数据文件（不合格报告数据.data.js）重新加载最新数据">🔄 刷新数据</button>
            <button class="btn-reset" onclick="bh_resetToDefaultBuhege()">🔄 重置数据</button>
            <button class="btn-clear" onclick="bh_clearData()">🗑️ 清空数据</button>
            <input type="file" id="bh-fileInput" accept=".xlsx,.xls,.csv" onchange="importData(event)">
        </div>

        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-item">
                    <label>提出月份</label>
                    <select id="bh-filterMonth" onchange="filterData()">

                    </select>
                </div>
                <div class="filter-item">
                    <label>产品类别</label>
                    <select id="bh-filterProduct" onchange="filterData()">
                        <option value="">全部</option>

                <div class="filter-item">

                    <select id="bh-filterDeptCode" onchange="filterData()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>问题类别</label>
                    <select id="bh-filterCategory" onchange="filterData()">
                        <option value="">全部</option>
                    </select>
                </div>
            </div>
        </div>


        <div style="margin-bottom: 15px; text-align: right;">
            <button class="chart-card-toggle" onclick="bh_toggleAllCharts()" style="font-size: 14px; padding: 8px 16px;">

                <div id="bh-chartProduct" class="chart-container"></div>

            <div class="chart-card">

(function(){

        };


        // 为每条数据添加问题类别名称字段
        rawData.forEach(d => {
            if (d['问题类别'] && categoryMapping[d['问题类别']]) {
                d['问题类别名称'] = categoryMapping[d['问题类别']];
            }
        });

        let filteredData = rawData;

        function parseFaultCode(code) {
            if (!code) return {};
            const parts = String(code).split('-');
            if (parts.length >= 4) {
                return {
                    '产品类别': parts[0],
                    '责任部门': parts[1],
                    '问题类别一级': parts[2],
                    '问题类别二级': parts[3],
                    '问题类别名称': categoryMapping[parts[3]] || parts[3]
                };
            }
            return {};
        }

        function extractSupplier(responsible) {
            if (!responsible) return null;
            const respStr = String(responsible);
            if (respStr.includes('供应商-')) {
                return respStr.replace('供应商-', '');
            }
            return null;
        }

        // 统一获取数据应该使用的提出月份
        function getStatsMonth(fileName, serialNum) {
            var monthFromName = inferMonthFromFileName(fileName);
            if (monthFromName) return monthFromName;
            var fromSeq = inferMonthFromSerialNumber(serialNum);
            return fromSeq || null;
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let newData = [];
                    
                    if (file.name.endsWith('.csv')) {
                        const text = e.target.result;
                        const lines = text.split('\n');
                        const headers = lines[0].split(',');
                        for (let i = 1; i < lines.length; i++) {
                            if (lines[i].trim()) {
                                const values = lines[i].split(',');
                                const row = {};
                                headers.forEach((h, idx) => row[h.trim()] = values[idx] ? values[idx].trim() : '');
                                newData.push(row);
                            }
                        }
                    } else {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        
                        // 根据文件名推断该文件应该使用的提出月份
                        var inferredMonth = getStatsMonth(file.name, null);
                        
                        // 读取所有sheet的数据
                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            // 使用header:1获取原始二维数组格式，这样不会受第一行是否含表头影响
                            const rawDataArr = XLSX.utils.sheet_to_json(worksheet, {header: 1, skipEmptyLines: true});
                            
                            // 在二维数组中找到真正的表头行（包含'序号'和'流水号'的那一行）
                            let headerRowIndex = -1;
                            for (let i = 0; i < rawDataArr.length; i++) {
                                if (rawDataArr[i] && rawDataArr[i][0] === '序号' && rawDataArr[i][1] === '流水号') {
                                    headerRowIndex = i;
                                    break;
                                }
                            }
                            
                            if (headerRowIndex < 0) return; // 没有找到表头，跳过此sheet
                            
                            // 从表头下一行开始遍历数据行
                            for (let i = headerRowIndex + 1; i < rawDataArr.length; i++) {
                                const rawRow = rawDataArr[i];
                                // 检查是否有流水号（第2列，索引为1）
                                if (!rawRow || !rawRow[1] || String(rawRow[1]).indexOf('WL-') !== 0) continue;
                                
                                const mappedRow = {};
                                for (let j = 0; j < Math.min(rawDataArr[headerRowIndex].length, rawRow.length); j++) {
                                    const h = rawDataArr[headerRowIndex][j];
                                    if (h) mappedRow[h] = rawRow[j];
                                }
                                
                                if (!mappedRow['提出月份'] && inferredMonth) {
                                    mappedRow['提出月份'] = inferredMonth;
                                }
                                
                                newData.push(mappedRow);
                            }
                        });
                    }

                    // 处理新导入的数据
                    newData.forEach(row => {
                        // 添加提出月份（如果没有且尚未推断）
                        if (!row['提出月份']) {
                            var tryInfer = getStatsMonth(file.name, row['流水号']);
                            row['提出月份'] = tryInfer || new Date().toISOString().slice(0, 7);
                        }
                        
                        // 映射字段名：Excel中的"责任部门" -> 表格中的"责任部门"
                        if (row['责任部门'] && !row['责任部门']) {
                            row['责任部门'] = row['责任部门'];
                        }
                        
                        // 映射字段名：Excel中的"问题类别" -> 表格中的"问题类别二级"
                        if (row['问题类别'] && !row['问题类别二级']) {
                            row['问题类别二级'] = row['问题类别'];
                        }
                        
                        // 解析故障代码（如果还没有解析过）
                        if (row['不合格原因类别'] && !row['问题类别名称']) {
                            const parsed = parseFaultCode(row['不合格原因类别']);
                            // 只添加缺失的字段，不覆盖已有字段
                            if (!row['产品类别'] && parsed['产品类别']) {
                                row['产品类别'] = parsed['产品类别'];
                            }
                            if (!row['责任部门'] && parsed['责任者']) {
                                row['责任部门'] = parsed['责任者'];
                            }
                            if (!row['问题类别一级'] && parsed['问题类别一级']) {
                                row['问题类别一级'] = parsed['问题类别一级'];
                            }
                            if (!row['问题类别二级'] && parsed['问题类别']) {
                                row['问题类别二级'] = parsed['问题类别'];
                            }
                            if (!row['问题类别名称'] && parsed['问题类别名称']) {
                                row['问题类别名称'] = parsed['问题类别名称'];
                            }
                        }
                        

                    });

                    // 合并数据
                    rawData = rawData.concat(newData);
                    
                    console.log(`导入成功，新增 ${newData.length} 条记录，总计 ${rawData.length} 条记录`);
                    
                    // 重新初始化筛选器并刷新数据
                    initFilters();
                    filterData();
                    
                    alert(`导入成功！\n新增 ${newData.length} 条记录\n总计 ${rawData.length} 条记录`);
                    document.getElementById("bh-totalRecords").textContent = rawData.length;
                } catch (error) {
                    console.error('导入失败:', error);
                    alert('导入失败：' + error.message);
                }
            };

            if (file.name.endsWith('.csv')) {
                reader.readAsText(file);
            } else {
                reader.readAsArrayBuffer(file);
            }
            
            // 清空文件输入框，允许重复导入同一文件
            event.target.value = '';
        }

        function bh_exportData() {
            if (typeof XLSX === 'undefined') {
                alert('⚠️ Excel 导出组件未加载！请确认 xlsx.full.min.js 与页面在同一目录下，然后刷新页面重试。');
                return;
            }
            if (filteredData.length === 0) {
                alert('没有数据可导出');
                return;
            }

            // 导出字段顺序，包含提出月份（技术部门意见 = 技术/电气/结构工程师意见合并）
            const exportFields = [
                '序号', '流水号', '项目名称', '不合格描述', '不合格原因分析',
                '不合格原因类别', '产品类别', '责任部门', '问题类别', 'QA意见',
                '责任者', '技术部门意见',
                '提出月份'
            ];

            // 准备导出数据（代码字段转换为中文名称，与界面显示一致）
            function bh_exportValue(row, field) {
                if (field === '产品类别') return (PRODUCT_CODE_MAP && PRODUCT_CODE_MAP[row['产品类别']]) || row['产品类别'] || '';
                if (field === '责任部门') return (DEPT_CODE_MAP && DEPT_CODE_MAP[row['责任部门']]) || row['责任部门'] || '';
                if (field === '问题类别') return (categoryMapping && categoryMapping[row['问题类别']]) || row['问题类别'] || '';
                if (field === '不合格原因类别') {
                    const raw = row['不合格原因类别'] || '';
                    if (!raw) return '';
                    const parsed = parseFaultCode(raw);
                    if (parsed && parsed['产品类别']) {
                        return [
                            PRODUCT_CODE_MAP[parsed['产品类别']] || parsed['产品类别'],
                            DEPT_CODE_MAP[parsed['责任部门']] || parsed['责任部门'],
                            parsed['问题类别一级'] || '',
                            parsed['问题类别名称'] || ''
                        ].filter(Boolean).join('-');
                    }
                    return raw;
                }
                if (field === '技术部门意见') {
                    // 电气/结构工程师意见合并进技术部门意见
                    return [row['技术部门意见'], row['电气工程师意见'], row['结构工程师意见']].filter(Boolean).join('\n\n');
                }
                return row[field] || '';
            }
            const bh_exportData = filteredData.map((row, index) => {
                const exportRow = {};
                exportFields.forEach(field => {
                    if (field === '序号') {
                        exportRow[field] = index + 1;
                    } else {
                        exportRow[field] = bh_exportValue(row, field);
                    }
                });
                return exportRow;
            });

            // 使用XLSX库导出为xlsx格式
            const ws = XLSX.utils.json_to_sheet(bh_exportData, { header: exportFields });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '不合格报告');
            XLSX.writeFile(wb, `不合格报告数据_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function bh_clearData() {
            if (confirm('确定要清空所有数据吗？')) {
                rawData = [];
                filteredData = [];
                bh_saveToStorageBuhege();  // 保存空数据到localStorage
                initFilters();
                updateCharts();
                updateTable();
                document.getElementById("bh-totalRecords").textContent = rawData.length;
                alert('数据已清空');
            }
        }

        
// 责任部门到中文名称的映射
const DEPT_CODE_MAP = {
    'JX': '机械设计部',
    'DQ': '电控部',
    'RJ': '软件部',
    'ZT': '规划总体部',
    'XM': '项目部',
    'ZL': '质量部',
    'XS': '市场部',

};

// 产品类别代码到中文名称的映射

        function initFilters() {
            // 提出月份
            const months = [...new Set(rawData.map(d => d['提出月份']).filter(m => m))].sort().reverse();
            const monthSelect = document.getElementById('bh-filterMonth');
            monthSelect.innerHTML = '<option value="">全部</option>';
            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                monthSelect.appendChild(opt);
            });

            

            

            // 产品类别
            const products = [...new Set(rawData.map(d => d['产品类别']).filter(p => p))].sort();
            const productSelect = document.getElementById('bh-filterProduct');
            productSelect.innerHTML = '<option value="">全部</option>';
            products.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = PRODUCT_CODE_MAP[p] || p;
                productSelect.appendChild(opt);
            });

            // 责任部门
            const deptCodes = [...new Set(rawData.map(d => d['责任部门']).filter(d => d))].sort();
            const deptCodeSelect = document.getElementById('bh-filterDeptCode');
            deptCodeSelect.innerHTML = '<option value="">全部</option>';
            deptCodes.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                // 显示中文名称，如果没有映射则显示原值
                const displayName = DEPT_CODE_MAP[d] || d;
                opt.textContent = displayName;
                deptCodeSelect.appendChild(opt);
            });



            // 问题类别
            const category2s = [...new Set(rawData.map(d => d['问题类别']).filter(c => c))].sort();
            const category2Select = document.getElementById('bh-filterCategory');
            category2Select.innerHTML = '<option value="">全部</option>';
            category2s.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c + ' (' + (categoryMapping[c] || c) + ')';
                category2Select.appendChild(opt);
            });
        }

        function filterData() {
            const month = document.getElementById('bh-filterMonth').value;
            const product = document.getElementById('bh-filterProduct').value;
            const deptCode = document.getElementById('bh-filterDeptCode').value;

            const category = document.getElementById('bh-filterCategory').value;

            filteredData = rawData.filter(d => {
                if (month && d['提出月份'] !== month) return false;
                if (product && d['产品类别'] !== product) return false;
                if (deptCode && d['责任部门'] !== deptCode) return false;

                if (category && d['问题类别'] !== category) return false;
                return true;
            });

            updateCharts();
            updateTable();
            document.getElementById('bh-totalRecords').textContent = rawData.length;
        }

        // 显示图表点击后的数据列表
        function showDataList(title, records) {
            var body = document.getElementById('bh-dataModalBody');
            var html = '<p style="margin-bottom:12px;color:#666;">共 <b>' + records.length + '</b> 条记录，点击行查看详情</p>';
            html += '<table><thead><tr>';
            html += '</tr></thead><tbody>';
            records.forEach(function(r, idx) {
                // 找到在filteredData中的真实索引
                var realIdx = filteredData.indexOf(r);
                html += '<tr onclick="bh_closeDataModal();bh_showDetail(' + realIdx + ')">';
                html += '<td>' + (r['提出月份'] || '') + '</td>';
                html += '<td>' + (r['流水号'] || '') + '</td>';
                html += '<td>' + (r['项目名称'] || '').substring(0, 30) + '</td>';
                html += '<td>' + (r['问题类别名称'] || '') + '</td>';
                html += '<td>' + (r['责任者'] || '') + '</td>';

                html += '</tr>';
            });
            html += '</tbody></table>';
            body.innerHTML = html;
            document.getElementById('bh-dataModalTitle').textContent = title;
            document.getElementById('bh-dataModal').style.display = 'block';
        }

        function bh_closeDataModal() {
            document.getElementById('bh-dataModal').style.display = 'none';
        }

        function bh_showSupplierDetail(supplierName) {
            var records = filteredData.filter(d => d['责任者'] === '供应商-' + supplierName);
            showDataList('🏭 供应商：' + supplierName + '（共' + records.length + '条）', records);
        }

        function updateCharts() {
            // 图表库(CDN)未加载时降级：只提示，不阻塞表格渲染
            if (typeof echarts === 'undefined' && typeof Chart === 'undefined') {
                window.__chartLibFallback && window.__chartLibFallback();
                return;
            }
            // 月度趋势（不受筛选器影响）
            const monthData = {};
            rawData.forEach(d => {
                if (d['提出月份']) {
                    monthData[d['提出月份']] = (monthData[d['提出月份']] || 0) + 1;
                }
            });
            const sortedMonths = Object.keys(monthData).sort();
            const trendChart = echarts.init(document.getElementById('bh-chartTrend'));
            trendChart.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: sortedMonths },
                yAxis: { type: 'value' },
                series: [{
                    type: 'line',
                    data: sortedMonths.map(m => monthData[m]),
                    smooth: true,
                    itemStyle: { color: '#667eea' }
                }]
            });
            trendChart.off('click');
            trendChart.on('click', function(params) {
                var month = sortedMonths[params.dataIndex];
                var records = rawData.filter(d => d['提出月份'] === month);
                showDataList('📅 ' + month + ' 的报告（共' + records.length + '条）', records);
            });


            const productData = {};
            filteredData.forEach(d => {
                if (d['产品类别']) {
                    const productCode = d['产品类别'];
                    const productName = PRODUCT_CODE_MAP[productCode] || productCode;
                    productData[productName] = (productData[productName] || 0) + 1;
                }
            });
            const productChart = echarts.init(document.getElementById('bh-chartProduct'));
            productChart.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    data: Object.entries(productData).map(([name, value]) => ({ name, value })),
                    label: { formatter: '{b}: {c}' }
                }]
            });
            productChart.off('click');
            productChart.on('click', function(params) {
                var productName = params.name;
                var productCode = Object.keys(PRODUCT_CODE_MAP).find(key => PRODUCT_CODE_MAP[key] === productName) || productName;
                var records = filteredData.filter(d => d['产品类别'] === productCode);
                showDataList('📦 产品类别：' + productName + '（共' + records.length + '条）', records);
            });

            // 责任部门分布
            const deptCodeData = {};
            filteredData.forEach(d => {
                if (d['责任部门']) {
                    // 使用责任部门代码，转换为中文名称
                    var deptCode = d['责任部门'];
                    var deptName = DEPT_CODE_MAP[deptCode] || deptCode;
                    deptCodeData[deptName] = (deptCodeData[deptName] || 0) + 1;
                }
            });
            
            // 按照数量从大到小排序
            const sortedDeptCode = Object.entries(deptCodeData).sort((a, b) => b[1] - a[1]);
            const deptCodeNames = sortedDeptCode.map(item => item[0]);
            const deptCodeValues = sortedDeptCode.map(item => item[1]);
            
            // 计算百分比
            const total = deptCodeValues.reduce((sum, val) => sum + val, 0);
            const deptCodePercentages = deptCodeValues.map(val => ((val / total) * 100).toFixed(2));
            
            const deptCodeChart = echarts.init(document.getElementById('bh-chartDeptCode'));
            deptCodeChart.setOption({
                tooltip: { 
                    trigger: 'axis', 
                    axisPointer: { type: 'shadow' },
                    formatter: function(params) {
                        let result = params[0].name + '<br/>';
                        params.forEach(param => {
                            if (param.seriesName === '数量') {

                                result += param.marker + param.seriesName + ': ' + param.value + '%<br/>';

                        });
                        return result;
                    }

                xAxis: { type: 'category', data: deptCodeNames, axisLabel: { show: true, interval: 0, rotate: 30 } },
                yAxis: [
                    { type: 'value', name: '数量', position: 'left' },
                    { type: 'value', name: '百分比', position: 'right', axisLabel: { formatter: '{value}%' }, max: 100 }
                ],

                    {
                        name: '数量',
                        type: 'bar',
                        data: deptCodeValues,
                        itemStyle: { 
                            color: function(params) {
                                return deptCodeNames[params.dataIndex] === '供应商' ? '#f56565' : '#764ba2';
                            }
                        },
                        label: { show: true, position: 'top' }
                    },
                    {
                        name: '百分比',
                        type: 'line',
                        yAxisIndex: 1,
                        data: deptCodePercentages,
                        smooth: true,
                        lineStyle: { width: 3, color: '#10b981' },
                        itemStyle: { color: '#10b981' },
                        label: { 
                            show: true, 
                            position: 'top',
                            formatter: '{c}%'
                        }
                    }
                ]
            });
            deptCodeChart.off('click');
            deptCodeChart.on('click', function(params) {
                var dept = deptCodeNames[params.dataIndex];
                if (dept === '供应商') {

                    var supplierDetailData = {};
                    filteredData.forEach(d => {
                        if (d['责任者'] && d['责任者'].indexOf('供应商-') === 0) {
                            var supplierName = d['责任者'].replace('供应商-', '');
                            supplierDetailData[supplierName] = (supplierDetailData[supplierName] || 0) + 1;
                        }
                    });
                    var sortedSuppliers = Object.entries(supplierDetailData).sort((a, b) => b[1] - a[1]);
                    var html = '<p style="margin-bottom:12px;color:#666;">共 <b>' + sortedSuppliers.length + '</b> 个供应商，点击行查看详情</p>';
                    html += '<table><thead><tr><th>供应商名称</th><th>问题数量</th></tr></thead><tbody>';
                    sortedSuppliers.forEach(function(item) {

                    document.getElementById('bh-dataModal').style.display = 'block';
                } else {
                    var records = filteredData.filter(d => {

                        return deptName === dept;
                    });
                    showDataList('👥 责任部门：' + dept + '（共' + records.length + '条）', records);

            const category2Data = {};

                    category2Data[name] = (category2Data[name] || 0) + 1;
                }
            });
            const sortedCategory2 = Object.entries(category2Data).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const category2Chart = echarts.init(document.getElementById('bh-chartCategory2'));
            category2Chart.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'value' },

                    type: 'bar',
                    data: sortedCategory2.map(c => c[1]),
                    itemStyle: { color: '#48bb78' }
                }]
            });
            category2Chart.off('click');
            category2Chart.on('click', function(params) {
                var cat2Name = sortedCategory2[params.dataIndex][0];
                var cat2Code = cat2Name.split(' ')[0];
                var records = filteredData.filter(d => d['问题类别'] === cat2Code);
                showDataList('🔍 问题类别二级：' + cat2Name + '（共' + records.length + '条）', records);

            html += '<div class="detail-section">';
            html += '<h3>📝 问题描述</h3>';
            html += '<div class="detail-grid">';

            html += createDetailItem('不合格原因分析', report['不合格原因分析'], true, true);

            let techOpinions = [];

        function createDetailItem(label, value, full = false, longText = false) {
            const className = full ? 'detail-item detail-full' : 'detail-item';
            const valueClass = longText ? 'detail-value long-text' : 'detail-value';
            return `<div class="${className}">
                <div class="detail-label">${label}</div>
                <div class="${valueClass}">${value || ''}</div>
            </div>`;
        }

        function bh_closeModal() {
            document.getElementById('bh-detailModal').style.display = 'none';
        }

        function bh_closeDataModal() {
            document.getElementById('bh-dataModal').style.display = 'none';
        }


        // 单个图表折叠/展开切换
        function bh_toggleSingleChart(btn) {
            var card = btn.closest('.chart-card');
            card.classList.toggle('collapsed');
            
            // 展开后需要resize图表
            if (!card.classList.contains('collapsed')) {
                setTimeout(function() {
                    var container = card.querySelector('.chart-container');
                    var chart = echarts.getInstanceByDom(container);
                    if (chart) chart.resize();
                }, 350);
            }
        }

        function bh_toggleAllCharts() {
            var cards = document.querySelectorAll('.chart-card');
            var allCollapsed = true;
            
            // 检查是否所有图表都已折叠
            cards.forEach(function(card) {
                if (!card.classList.contains('collapsed')) {
                    allCollapsed = false;
                }
            });
            
            // 如果全部已折叠，则全部展开；否则全部折叠
            cards.forEach(function(card) {
                if (allCollapsed) {
                    card.classList.remove('collapsed');
                } else {
                    card.classList.add('collapsed');
                }
            });
            
            // 展开后需要resize所有图表
            if (allCollapsed) {
                setTimeout(function() {
                    cards.forEach(function(card) {
                        var container = card.querySelector('.chart-container');
                        var chart = echarts.getInstanceByDom(container);
                        if (chart) chart.resize();
                    });
                }, 350);
            }
        }

        // 表格折叠/展开切换
        function bh_toggleTable() {
            var wrapper = document.getElementById('bh-tableWrapper');
            var btn = document.querySelector('.table-toggle-btn');
            if (wrapper.classList.contains('collapsed')) {
                wrapper.classList.remove('collapsed');
                btn.textContent = '📋 折叠表格';
            } else {
                wrapper.classList.add('collapsed');
                btn.textContent = '📋 展开完整表格';
            }
        }

            const modal = document.getElementById('bh-detailModal');
            if (event.target === modal) {
                bh_closeModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                bh_closeModal();
            }
        });

        function updateTable() {
            var displayData = tableFilteredData.length > 0 ? tableFilteredData : filteredData;
            document.getElementById('bh-tableCount').textContent = displayData.length;
            const tbody = document.getElementById('bh-tableBody');
            tbody.innerHTML = displayData.map((d) => {
                var originalIndex = filteredData.indexOf(d);
                return `
                    <tr class="clickable" onclick="bh_showDetail(${originalIndex})">
                        <td>${d['流水号'] || ''}</td>
                        <td>${d['项目名称'] || ''}</td>

                        <td>${DEPT_CODE_MAP[d['责任部门']] || d['责任部门'] || ''}</td>
                        <td>${categoryMapping[d['问题类别']] || d['问题类别'] || ''}</td>
                        <td>${d['责任者'] || ''}</td>
                        <td>${d['问题状态'] || ''}</td>
                    </tr>
                `;
            }).join('');
        }

        let tableFilteredData = [];
        let tableExpanded = false;
        
        function bh_toggleTable() {
            var wrapper = document.getElementById('bh-tableWrapper');
            var btn = document.getElementById('bh-tableToggleBtn');
            
            if (wrapper.classList.contains('collapsed')) {
                wrapper.classList.remove('collapsed');
                btn.textContent = '📋 收起';
                tableExpanded = true;
            } else {
                wrapper.classList.add('collapsed');
                btn.textContent = '📋 展开';
                tableExpanded = false;
            }
        }
        
        function filterTable() {
            var searchInput = document.getElementById('bh-tableSearchInput');
            var keyword = searchInput.value.toLowerCase().trim();
            
            if (!keyword) {
                tableFilteredData = [...filteredData];
            } else {
                tableFilteredData = filteredData.filter(d => {
                    var serialNo = (d['流水号'] || '').toLowerCase();
                    var projectName = (d['项目名称'] || '').toLowerCase();
                    var responsible = (d['责任者'] || '').toLowerCase();
                    
                    return serialNo.includes(keyword) || 
                           projectName.includes(keyword) || 
                           responsible.includes(keyword);
                });
            }
            
            updateTable();
        }

        function init() {
            initFilters();
            updateCharts();
            updateTable();
        }

// ========== 数据持久化管理 ==========
const STORAGE_KEY_BUHEGE = 'buhege_data';

function loadFromStorageBuhege() {
    const saved = localStorage.getItem(STORAGE_KEY_BUHEGE);
    if (saved) {
        try {
            const data = JSON.parse(saved);
            if (Array.isArray(data) && data.length > 0) {
                return data;
            }
        } catch (e) {
            console.error('数据加载失败:', e);
        }
    }
    return null;
}

function bh_saveToStorageBuhege() {
    try {
        localStorage.setItem(STORAGE_KEY_BUHEGE, JSON.stringify(rawData));
        console.log('数据已自动保存');
    } catch (e) {
        console.error('数据保存失败:', e);
    }
}

function deleteDataBuhege() {
    const seq = Number(prompt('请输入要删除的序号：'));
    const index = rawData.findIndex(r => r['序号'] === seq);
    
    if (index === -1) {
        alert('未找到该记录！');
        return;
    }
    
    if (confirm(`确定要删除序号${seq}的记录吗？`)) {
        rawData.splice(index, 1);
        bh_saveToStorageBuhege();
        init();
        document.getElementById("bh-totalRecords").textContent = rawData.length;
        alert('数据删除成功！');
    }
}

// 重新加载外部数据文件（不合格报告数据.data.js），并清除本地存储覆盖
function bh_reloadExternalData() {
    if (!confirm('确定要刷新数据吗？将重新从外部数据文件加载，并清除浏览器中保存的修改！')) {
        return;
    }
    localStorage.removeItem(STORAGE_KEY_BUHEGE);
    var src = '不合格报告数据.data.js';
    var old = document.querySelector('script[src="不合格报告数据.data.js"]');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var s = document.createElement('script');
    s.src = src;
    s.onload = function() {
        if (typeof RAW_BUHEGE !== 'undefined' && Array.isArray(RAW_BUHEGE)) {
            rawData = RAW_BUHEGE;
        }
        initFilters();
        filterData();
        bh_saveToStorageBuhege();
        alert('✅ 数据已刷新！当前共 ' + rawData.length + ' 条记录。');
    };
    s.onerror = function() {
        alert('⚠️ 外部数据文件加载失败，请确认「不合格报告数据.data.js」与页面在同一目录下！');
    };
    document.head.appendChild(s);
}

function bh_exportStandaloneHTML() {
    if (typeof RAW_BUHEGE === 'undefined') {
        alert('错误：数据未加载！无法生成独立HTML。');
        return;
    }
    let htmlContent = document.documentElement.outerHTML;
    const inlineDataScript = '\n<script>var RAW_BUHEGE = ' + JSON.stringify(RAW_BUHEGE, null, 2) + ';<\/script>\n';
    const externalScriptRegex = /<script\s+src="[^"]*不合格报告数据[^"]*\.js"[^>]*><\/script>/i;
    if (externalScriptRegex.test(htmlContent)) {
        htmlContent = htmlContent.replace(externalScriptRegex, inlineDataScript);
    } else {
        htmlContent = htmlContent.replace('</head>', inlineDataScript + '</head>');
    }
    htmlContent = htmlContent.replace(
        /const saved = localStorage\.getItem\('buhegeData'\);[\s\S]*?catch\(e\)\s*\{\}/g,
        '// 独立HTML模式：跳过本地存储恢复'
    );
    const blob = new Blob(['<!DOCTYPE html>\n' + htmlContent], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '现场不合格报告BI分析系统_独立版_' + new Date().toISOString().slice(0, 10) + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    alert('✅ 独立HTML已导出！\n\n该文件已嵌入 ' + RAW_BUHEGE.length + ' 条最新数据，\n无需外部JS文件，可直接双击打开使用。');
}

<script>
window.__chartLibFallback = window.__chartLibFallback || function() {};
(function(){
  function b64ToBytes(b64){var bin=atob(b64);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++){u[i]=bin.charCodeAt(i);}return u;}
  async function unpack(b64){
    var bytes=b64ToBytes(b64);
    var ds=new DecompressionStream('gzip');
    var stream=new Blob([bytes]).stream().pipeThrough(ds);
    var ab=await new Response(stream).arrayBuffer();
    return new TextDecoder().decode(ab);
  }
  window.__DSH_BOOT = async function(){
    try{
      if(window.__DSH_LIB_B64){var libsrc=await unpack(window.__DSH_LIB_B64);(0,eval)(libsrc);}
      if(window.__DSH_DATA_B64){var datasrc=await unpack(window.__DSH_DATA_B64);(0,eval)(datasrc);}
    }catch(e){console.error('解压失败',e);var bar=document.createElement('div');bar.style.cssText='position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:8px;z-index:99999;font-size:13px;text-align:center;';bar.textContent='⚠️ 图表库解压失败: '+e.message;document.body.appendChild(bar);}

  };
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){window.__DSH_BOOT();});}
  else{window.__DSH_BOOT();}
})();
