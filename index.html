<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>质量管理看板 · 安全入口</title>
<style>
body{font-family:'Microsoft YaHei',sans-serif;background:#0a0e27;color:#e8ecf7;margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.card{background:#131a3a;border:1px solid #2a3560;border-radius:14px;padding:42px 50px;margin:8vh auto;max-width:640px;width:calc(100% - 40px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{font-size:22px;margin:0 0 6px}
.sub{color:#9aa6c7;font-size:13px;margin-bottom:26px}
label{font-size:13px;color:#c9d2f0;display:block;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:11px 14px;border-radius:8px;border:1px solid #3a4a80;background:#0d1430;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#5b8def}
button.act{margin-top:20px;padding:11px 0;width:100%;border:none;border-radius:8px;background:#2f6bff;color:#fff;font-size:15px;cursor:pointer}
button.act:hover{background:#4780ff}
.err{color:#ff7d7d;font-size:13px;min-height:18px;margin-top:10px}
#boards{display:none;margin-top:24px}
#boards .b{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:8px;border:1px solid #2a3560;background:#0d1430;color:#dbe3ff;font-size:15px;cursor:pointer}
#boards .b:hover{border-color:#5b8def;background:#141d44}
#viewer{display:none;width:100%;height:92vh;border:none;border-radius:10px;background:#fff}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1200px;padding:14px 20px;box-sizing:border-box}
.top a{color:#7cb3ff;text-decoration:none;font-size:13px}
#load{display:none;color:#9aa6c7;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="card" id="gate">
  <h1>🔒 质量管理看板</h1>
  <div class="sub">请输入访问密码解锁看板（密码请在部署方获取）</div>
  <label>访问密码</label>
  <input type="password" id="pw" placeholder="请输入密码" autocomplete="off">
  <button class="act" id="unlock">解 锁</button>
  <div class="err" id="err"></div>
  <div id="load">正在验证密码…</div>
  <div id="boards"></div>
</div>
<div class="top" id="topbar" style="display:none">
  <span style="font-size:14px;color:#c9d2f0">📊 质量管理看板</span>
  <a href="#" id="back">← 返回看板列表</a>
</div>
<iframe id="viewer"></iframe>
<script>
const SALT = Uint8Array.from(atob("7+13vB8YElEkhKkZWAZazQ=="), c => c.charCodeAt(0));
const ITER = 310000;
const BOARDS = [{"bin":"data/bh.bin","title":"不合格品看板"},{"bin":"data/fk.bin","title":"物流反馈单看板"},{"bin":"data/fy.bin","title":"费用看板"},{"bin":"data/hk.bin","title":"横展看板 · 项目整改跟踪"},{"bin":"data/ns.bin","title":"内审看板"},{"bin":"data/sj.bin","title":"设计修改单看板"}];
function b64ToBuf(b){ const s = atob(b); const u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function bufToB64(buf){ const s = String.fromCharCode.apply(null, new Uint8Array(buf)); return btoa(s); }
async function deriveKey(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:SALT, iterations:ITER, hash:"SHA-256" }, km,
    { name:"AES-GCM", length:256 }, false, ["decrypt"]);
}
async function decryptB64(key, b64){
  const buf = b64ToBuf(b64);
  const iv = buf.slice(0,12), tag = buf.slice(12,28), data = buf.slice(28);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv, additionalData:new Uint8Array(0), tagLength:128 }, key, data);
  return new TextDecoder().decode(pt);
}
const $ = id => document.getElementById(id);
let KEY = null;
$("unlock").addEventListener("click", async () => {
  const pw = $("pw").value;
  $("load").style.display = "block"; $("err").textContent = "";
  try {
    const key = await deriveKey(pw);
    const chk = await (await fetch("data/check.bin")).text();
    let ok = false;
    try { ok = (await decryptB64(key, chk)) === "DSH-OK"; } catch(e){ ok = false; }
    if (!ok) { $("err").textContent = "密码错误，请重试"; return; }
    KEY = key;
    $("pw").style.display = "none"; $("unlock").style.display = "none"; $("label").style.display = "none";
    $("err").textContent = "";
    $("topbar").style.display = "flex";
    const box = $("boards"); box.style.display = "block";
    box.innerHTML = BOARDS.map(b => "<button class='b' data-bin='" + b.bin + "'>" + b.title + "</button>").join("");
  } catch(e){ $("err").textContent = "解锁出错：" + e.message; }
  finally { $("load").style.display = "none"; }
});
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button.b");
  if (!t) return;
  $("load").style.display = "block";
  try {
    const bin = t.dataset.bin;
    const ct = await (await fetch(bin)).text();
    const plain = await decryptB64(KEY, ct);
    $("gate").style.display = "none";
    const v = $("viewer"); v.style.display = "block";
    v.srcdoc = plain;
    document.title = t.textContent;
  } catch(e){ $("err").textContent = "打开看板出错：" + e.message; }
  finally { $("load").style.display = "none"; }
});
$("back").addEventListener("click", ev => {
  ev.preventDefault();
  $("viewer").style.display = "none"; $("viewer").srcdoc = "";
  $("gate").style.display = "block";
  document.title = "质量管理看板 · 安全入口";
});
$("pw").addEventListener("keydown", ev => { if (ev.key === "Enter") $("unlock").click(); });
</script>
</body>
</html>
