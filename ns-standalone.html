<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内审问题改善跟踪看板</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0a0e27;
  --bg-secondary: #111638;
  --bg-card: #1a1f4e;
  --text-primary: #e8eaf6;
  --text-secondary: #9fa8da;
  --accent-blue: #4fc3f7;
  --accent-purple: #b388ff;
  --accent-green: #69f0ae;
  --accent-orange: #ffab40;
  --accent-red: #ff5252;
  --accent-cyan: #18ffff;
  --glow-blue: rgba(79, 195, 247, 0.3);
  --glow-purple: rgba(179, 136, 255, 0.3);
}

body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse at 20% 50%, rgba(79, 195, 247, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(179, 136, 255, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(105, 240, 174, 0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ===== 头部 ===== */
.header {
  background: linear-gradient(135deg, #0d1137 0%, #1a237e 50%, #0d1137 100%);
  border-bottom: 1px solid rgba(79, 195, 247, 0.2);
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo { width: 56px; height: 56px; border-radius: 12px; object-fit: contain; background: #fff; padding: 4px; box-shadow: 0 0 20px var(--glow-blue); }
.header-title h1 { font-size: 24px; font-weight: 700; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
.header-title .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 1px; }
.header-right { display: flex; align-items: center; gap: 16px; }
.datetime { text-align: right; font-size: 13px; color: var(--text-secondary); }
.datetime .time { font-size: 20px; font-weight: 700; color: var(--accent-cyan); font-variant-numeric: tabular-nums; }

/* 头部工具栏按钮 */
.header-tools { display: flex; gap: 8px; }
.header-tools button {
  padding: 8px 16px; border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 8px;
  background: rgba(79, 195, 247, 0.08); color: var(--accent-blue);
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s;
  display: flex; align-items: center; gap: 6px;
}
.header-tools button:hover { background: rgba(79, 195, 247, 0.2); border-color: var(--accent-blue); }
.header-tools button.active { background: rgba(79, 195, 247, 0.25); border-color: var(--accent-blue); }

/* ===== 面包屑 + 看板切换栏 ===== */
.breadcrumb {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 48px;
  background: rgba(17, 22, 56, 0.95);
  border-bottom: 1px solid rgba(79, 195, 247, 0.1);
  padding: 0 24px;
  display: none; align-items: center; gap: 0;
}
.breadcrumb.show { display: flex; }
.breadcrumb .back-btn {
  padding: 10px 18px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.3s; white-space: nowrap; margin-right: 16px;
}
.breadcrumb .back-btn:hover { transform: translateX(-3px); box-shadow: 0 0 15px var(--glow-blue); }

/* 看板切换标签 */
.board-tabs { display: flex; gap: 0; flex: 1; overflow-x: auto; }
.board-tab {
  padding: 12px 18px; border: none; background: transparent;
  color: var(--text-secondary); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
  border-bottom: 2px solid transparent; position: relative;
}
.board-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
.board-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); font-weight: 600; }
.board-tab .tab-key { font-size: 10px; background: rgba(79, 195, 247, 0.15); color: var(--accent-blue); padding: 1px 5px; border-radius: 3px; margin-right: 6px; font-weight: 700; }

/* 全屏按钮 */
.fullscreen-btn {
  padding: 8px 14px; border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 6px;
  background: rgba(79, 195, 247, 0.08); color: var(--accent-blue);
  font-size: 16px; cursor: pointer; transition: all 0.3s; margin-left: 12px; white-space: nowrap;
}
.fullscreen-btn:hover { background: rgba(79, 195, 247, 0.2); }

/* ===== 主内容区 ===== */
.main-content { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 32px 32px; }

/* ===== KPI 概览区 ===== */
.kpi-overview {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px;
}
@media (max-width: 1024px) { .kpi-overview { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) { .kpi-overview { grid-template-columns: repeat(2, 1fr); } }

.kpi-item {
  background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 20px 16px; text-align: center;
  position: relative; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s;
}
.kpi-item:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.kpi-item::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-item:nth-child(1)::before { background: var(--accent-blue); }
.kpi-item:nth-child(2)::before { background: var(--accent-orange); }
.kpi-item:nth-child(3)::before { background: var(--accent-green); }
.kpi-item:nth-child(4)::before { background: var(--accent-red); }
.kpi-item:nth-child(5)::before { background: var(--accent-cyan); }
.kpi-item:nth-child(6)::before { background: var(--accent-purple); }
.kpi-icon { font-size: 24px; margin-bottom: 8px; }
.kpi-value { font-size: 32px; font-weight: 800; line-height: 1.1; }
.kpi-item:nth-child(1) .kpi-value { color: var(--accent-blue); }
.kpi-item:nth-child(2) .kpi-value { color: var(--accent-orange); }
.kpi-item:nth-child(3) .kpi-value { color: var(--accent-green); }
.kpi-item:nth-child(4) .kpi-value { color: var(--accent-red); }
.kpi-item:nth-child(5) .kpi-value { color: var(--accent-cyan); }
.kpi-item:nth-child(6) .kpi-value { color: var(--accent-purple); }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }
.kpi-trend { font-size: 11px; margin-top: 4px; font-weight: 600; }
.kpi-trend.down { color: var(--accent-green); }
.kpi-trend.up { color: var(--accent-red); }
.kpi-trend.flat { color: var(--text-secondary); }

/* ===== 欢迎区 ===== */
.welcome-section { text-align: center; margin-bottom: 28px; }
.welcome-section h2 { font-size: 18px; color: var(--text-secondary); font-weight: 400; }

/* ===== 卡片网格 ===== */
.dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 1024px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .dashboard-grid { grid-template-columns: 1fr; } }

/* ===== 看板卡片 ===== */
.dashboard-card {
  position: relative; background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px;
  padding: 28px 24px; cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
}
.dashboard-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-accent); opacity: 0.8; transition: height 0.3s; }
.dashboard-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 0%, var(--card-glow) 0%, transparent 70%); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
.dashboard-card:hover { transform: translateY(-6px) scale(1.02); border-color: var(--card-accent); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 30px var(--card-glow); }
.dashboard-card:hover::before { height: 4px; opacity: 1; }
.dashboard-card:hover::after { opacity: 1; }

.card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.card-icon { font-size: 36px; filter: drop-shadow(0 0 8px var(--card-glow)); }
.card-status {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap;
}
.card-status.ok { background: rgba(105, 240, 174, 0.15); color: var(--accent-green); }
.card-status.warn { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); }
.card-status.info { background: rgba(79, 195, 247, 0.15); color: var(--accent-blue); }

.card-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
.card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
.card-update { font-size: 11px; color: var(--text-secondary); opacity: 0.7; }
.card-shortcut { font-size: 11px; color: var(--text-secondary); opacity: 0.5; }
.card-shortcut kbd { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; }

.card-arrow { position: absolute; bottom: 16px; right: 16px; font-size: 16px; color: var(--text-secondary); opacity: 0; transform: translateX(-10px); transition: all 0.3s; }
.dashboard-card:hover .card-arrow { opacity: 1; transform: translateX(0); color: var(--card-accent); }

/* ===== Loading 动画 ===== */
.loading-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-primary); display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; z-index: 5;
}
.loading-overlay.show { display: flex; }
.loading-spinner {
  width: 40px; height: 40px; border: 3px solid rgba(79, 195, 247, 0.2);
  border-top-color: var(--accent-blue); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-secondary); }

/* ===== iframe 容器 ===== */
.iframe-container {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100; background: var(--bg-primary);
}
.iframe-container.show { display: block; }
.iframe-wrapper { position: relative; width: 100%; height: calc(100% - 48px); margin-top: 48px; }
.iframe-wrapper iframe { width: 100%; height: 100%; border: none; }

/* ===== 悬浮返回按钮 ===== */
.floating-back-btn {
  position: fixed; bottom: 30px; right: 30px; z-index: 1000;
  padding: 14px 28px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border: none; border-radius: 30px; color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 20px var(--glow-blue); transition: all 0.3s;
  display: none; align-items: center; gap: 8px;
}
.floating-back-btn.show { display: flex; }
.floating-back-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 30px var(--glow-blue); }

/* ===== 底部 ===== */
.footer {
  position: relative; z-index: 1; text-align: center; padding: 24px;
  color: var(--text-secondary); font-size: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 60px;
}

/* ===== 粒子动画 ===== */
.particles { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle { position: absolute; width: 2px; height: 2px; background: var(--accent-blue); border-radius: 50%; opacity: 0.3; animation: float linear infinite; }
@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
}

/* ===== 轮播指示器 ===== */
.carousel-indicator {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(17, 22, 56, 0.9); border: 1px solid rgba(79, 195, 247, 0.2);
  border-radius: 20px; padding: 8px 16px; display: none; align-items: center; gap: 12px;
  z-index: 1000; font-size: 12px; color: var(--text-secondary);
}
.carousel-indicator.show { display: flex; }
.carousel-indicator .progress-bar {
  width: 100px; height: 3px; background: rgba(79, 195, 247, 0.2); border-radius: 2px; overflow: hidden;
}
.carousel-indicator .progress-fill {
  height: 100%; background: var(--accent-blue); border-radius: 2px;
  animation: progress 30s linear infinite;
}
@keyframes progress { from { width: 0; } to { width: 100%; } }

</style>
</head>

// ============================================================
//  数据转换函数：对象数组 → 数组数组（按 SHEET1_COLUMNS 顺序）
// ============================================================
function normalizeData(objArray) {
    if (!Array.isArray(objArray) || objArray.length === 0) return [];
    // 如果第一条已经是数组，则直接返回（无需转换）
    if (Array.isArray(objArray[0])) return objArray;
    // 否则按字段名映射
    return objArray.map(obj => {
        return SHEET1_COLUMNS.map(key => {
            let val = obj[key];
            if (val === undefined || val === null) val = '';
            return String(val).trim();
        });
    });
}

//  实际使用的数据变量（内部始终为数组数组）
// ============================================================
let RAW_ROWS = [];
let DEPT_SUMMARY = [];
let deptChartInstance = null;
let lastImportedData = null;

// ============================================================
//  加载数据：外部 > localStorage > 内置
// ============================================================
function loadData() {
    let hasExternal = false;
    let data = null;

    // 1. 尝试加载外部数据
    if (typeof RAW_NEISHEN !== 'undefined' && Array.isArray(RAW_NEISHEN) && RAW_NEISHEN.length > 0) {
        data = normalizeData(RAW_NEISHEN);
        hasExternal = true;
        document.getElementById('ns-dataSourceLabel').textContent = '📁 外部数据（' + data.length + '条）';
    }

    // 2. 尝试加载 localStorage
    if (!data || data.length === 0) {
        const saved = localStorage.getItem('neishen_data');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    // 可能存的是对象数组，也可能是数组数组，统一转换
                    data = normalizeData(parsed);
                    document.getElementById('ns-dataSourceLabel').textContent = '📁 本地缓存数据（' + data.length + '条）';
                }
            } catch(e) { console.error('加载缓存失败：', e); }
        }
    }

    // 3. 使用内置示例
    if (!data || data.length === 0) {
        data = normalizeData(DEFAULT_DATA_OBJ);
        document.getElementById('ns-dataSourceLabel').textContent = '📁 内置示例数据（极少，仅3条）';
    }

    // 赋值给 RAW_ROWS
    RAW_ROWS = data;
}

function getDepartments(){ 
    return [...new Set(RAW_ROWS.map(r => r[8] || '未指定'))].sort(); 
}

function computeDeptSummary() {
    const map = new Map();
    RAW_ROWS.forEach(r => {
        const dept = r[8] || '未指定';
        const status = r[13] || '待整改';
        if (!map.has(dept)) map.set(dept, { dept, pending: 0, closed: 0 });
        const entry = map.get(dept);
        if (status === '已关闭') entry.closed++;
        else entry.pending++;
    });
    return Array.from(map.values());
}

function updateSummaryNumbers() {
    const total = RAW_ROWS.length;
    const pending = RAW_ROWS.filter(r => r[13] !== '已关闭').length;
    const closed = RAW_ROWS.filter(r => r[13] === '已关闭').length;
    document.getElementById('ns-totalCount').textContent = total;
    document.getElementById('ns-totalCountHeader').textContent = total;
    document.getElementById('ns-pendingCount').textContent = pending;
    document.getElementById('ns-closedCount').textContent = closed;
}

function renderChart(){
  const sorted = [...DEPT_SUMMARY].sort((a,b) => (b.pending+b.closed) - (a.pending+a.closed));
  const labels = sorted.map(d => d.dept);
  const totalData = sorted.map(d => d.pending + d.closed);
  const closedData = sorted.map(d => d.closed);
  const closeRate = sorted.map(d => {
    const total = d.pending + d.closed;
    return total > 0 ? Math.round(d.closed / total * 100) : 0;
  });

  const ctx = document.getElementById('ns-deptChart').getContext('2d');
  if(deptChartInstance) deptChartInstance.destroy();
  deptChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: '问题总数', data: totalData, backgroundColor: 'rgba(255, 99, 132, 0.7)', borderColor: 'rgba(255, 99, 132, 1)', borderWidth: 1, yAxisID: 'y', order: 2 },
        { label: '已关闭', data: closedData, backgroundColor: 'rgba(75, 192, 192, 0.7)', borderColor: 'rgba(75, 192, 192, 1)', borderWidth: 1, yAxisID: 'y', order: 2 },
        { label: '关闭率(%)', data: closeRate, type: 'line', borderColor: 'rgba(54, 162, 235, 1)', backgroundColor: 'rgba(54, 162, 235, 0.1)', borderWidth: 3, pointRadius: 5, pointBackgroundColor: 'rgba(54, 162, 235, 1)', tension: 0.3, yAxisID: 'y1', order: 1 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 14 } } },
        tooltip: {
          callbacks: {
            label: function(context) {
              if(context.dataset.label === '关闭率(%)') return context.dataset.label + ': ' + context.parsed.y + '%';
              return context.dataset.label + ': ' + context.parsed.y;
            }
          }
        }
      },
      scales: {
        x: { ticks: { font: { size: 12 } } },
        y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '数量', font: { size: 14 } }, ticks: { font: { size: 12 } } },
        y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: '关闭率(%)', font: { size: 14 } }, min: 0, max: 100, ticks: { callback: function(value) { return value + '%'; }, font: { size: 12 } }, grid: { drawOnChartArea: false } }
      }
    }
  });
}

function renderPendingTable(){
  const pendingByDept = {};
  RAW_ROWS.forEach(r => {
    const status = r[13] || '待整改';
    if (status !== '已关闭') {
      const dept = r[8] || '未指定';
      if (!pendingByDept[dept]) pendingByDept[dept] = { count: 0, dates: [] };
      pendingByDept[dept].count++;
      if (r[10]) pendingByDept[dept].dates.push(r[10]);
    }
  });
  const pendingList = [];
  for (const dept in pendingByDept) {
    const info = pendingByDept[dept];
    const dates = info.dates;
    const earliest = dates.length > 0 ? dates.reduce((a,b) => a < b ? a : b) : '未设定';
    pendingList.push({ dept, count: info.count, plan_date: earliest });
  }
  pendingList.sort((a,b) => a.dept.localeCompare(b.dept));
  
  let html = '<thead><tr><th>改善负责部门</th><th>待整改数量</th><th>预计整改时间</th></tr></thead><tbody>';
  let totalCount = 0;
  pendingList.forEach(item => {
    totalCount += item.count;
    html += `<tr class="clickable" style="cursor:pointer" onclick="ns_showPendingList('${item.dept}')" title="点击查看该部门待整改清单">
      <td>${item.dept}</td>
      <td><span class="pending-count">${item.count}</span></td>
      <td class="pending-date">${item.plan_date}</td>
    </tr>`;
  });
  html += `<tr style="background:#fff7e6;font-weight:700"><td>总计</td><td><span class="pending-count">${totalCount}</span></td><td>-</td><td>-</td></tr>`;
  html += '</tbody>';
  document.getElementById('ns-pendingTable').innerHTML = html;
}

      if (!haystack.includes(fKey)) return false;

    for (let i = 0; i < SHEET1_COLUMNS.length; i++) {

      else if (!v || v === 'NaN') v = '<span style="color:#ccc">-</span>';
      else v = String(v).replace(/</g,'&lt;').replace(/\n/g,'<br>');
      bodyHtml += '<td>' + v + '</td>';
    }

function ns_exportHtmlWithDataNeishen() {

}

function importExcelNeishen(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
            if (jsonData.length < 2) { alert('Excel 文件为空或格式错误！'); return; }
            const header = jsonData[0];
            const headerMatch = SHEET1_COLUMNS.every((col, idx) => {
                return header[idx] && header[idx].toString().trim() === col;
            });
            if (!headerMatch) {
                if (!confirm('Excel 表头与预期不完全匹配，是否继续导入？（可能数据列顺序不对）')) return;
            }
            const newData = [];
            for (let i = 1; i < jsonData.length; i++) {
                const row = jsonData[i];
                if (row.length < 2) continue;
                const cells = [];
                for (let j = 0; j < SHEET1_COLUMNS.length; j++) {
                    let val = row[j] !== undefined ? String(row[j]).trim() : '';
                    if (j === 2 || j === 10 || j === 11) {
                        if (!isNaN(val) && val.length === 5) {
                            const date = new Date((val - 25569) * 86400 * 1000);
                            val = date.toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
                        }
                    }
                    cells.push(val);
                }
                newData.push(cells);
            }
            if (newData.length === 0) { alert('未找到有效数据行！'); return; }
            if (confirm(`确定要导入 ${newData.length} 条数据吗？这将覆盖现有数据！`)) {
                lastImportedData = JSON.parse(JSON.stringify(RAW_ROWS));
                RAW_ROWS.length = 0;
                newData.forEach(row => RAW_ROWS.push(row));
                ns_saveToStorageNeishen();
                refreshAll();
                alert(`✅ 导入成功！共导入 ${newData.length} 条数据。`);
                event.target.value = '';
            }
        } catch(err) {
            alert('导入失败：' + err.message);
        }
    };
    reader.readAsArrayBuffer(file);
}

function ns_undoImportNeishen() {
    if (lastImportedData) {

            RAW_ROWS.length = 0;

            lastImportedData = null;

}

(function(){
  function b64ToBytes(b64){var bin=atob(b64);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++){u[i]=bin.charCodeAt(i);}return u;}
  async function unpack(b64){
    var bytes=b64ToBytes(b64);
    var ds=new DecompressionStream('gzip');
    var stream=new Blob([bytes]).stream().pipeThrough(ds);
    var ab=await new Response(stream).arrayBuffer();
    return new TextDecoder().decode(ab);
  }
