<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计修改单看板</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0a0e27;
  --bg-secondary: #111638;
  --bg-card: #1a1f4e;
  --text-primary: #e8eaf6;
  --text-secondary: #9fa8da;
  --accent-blue: #4fc3f7;
  --accent-purple: #b388ff;
  --accent-green: #69f0ae;
  --accent-orange: #ffab40;
  --accent-red: #ff5252;
  --accent-cyan: #18ffff;
  --glow-blue: rgba(79, 195, 247, 0.3);
  --glow-purple: rgba(179, 136, 255, 0.3);
}

body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse at 20% 50%, rgba(79, 195, 247, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(179, 136, 255, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(105, 240, 174, 0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ===== 头部 ===== */
.header {
  background: linear-gradient(135deg, #0d1137 0%, #1a237e 50%, #0d1137 100%);
  border-bottom: 1px solid rgba(79, 195, 247, 0.2);
  padding: 20px 40px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo { width: 56px; height: 56px; border-radius: 12px; object-fit: contain; background: #fff; padding: 4px; box-shadow: 0 0 20px var(--glow-blue); }
.header-title h1 { font-size: 24px; font-weight: 700; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
.header-title .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 1px; }
.header-right { display: flex; align-items: center; gap: 16px; }
.datetime { text-align: right; font-size: 13px; color: var(--text-secondary); }
.datetime .time { font-size: 20px; font-weight: 700; color: var(--accent-cyan); font-variant-numeric: tabular-nums; }

/* 头部工具栏按钮 */
.header-tools { display: flex; gap: 8px; }
.header-tools button {
  padding: 8px 16px; border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 8px;
  background: rgba(79, 195, 247, 0.08); color: var(--accent-blue);
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s;
  display: flex; align-items: center; gap: 6px;
}
.header-tools button:hover { background: rgba(79, 195, 247, 0.2); border-color: var(--accent-blue); }
.header-tools button.active { background: rgba(79, 195, 247, 0.25); border-color: var(--accent-blue); }

/* ===== 面包屑 + 看板切换栏 ===== */
.breadcrumb {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 48px;
  background: rgba(17, 22, 56, 0.95);
  border-bottom: 1px solid rgba(79, 195, 247, 0.1);
  padding: 0 24px;
  display: none; align-items: center; gap: 0;
}
.breadcrumb.show { display: flex; }
.breadcrumb .back-btn {
  padding: 10px 18px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.3s; white-space: nowrap; margin-right: 16px;
}
.breadcrumb .back-btn:hover { transform: translateX(-3px); box-shadow: 0 0 15px var(--glow-blue); }

/* 看板切换标签 */
.board-tabs { display: flex; gap: 0; flex: 1; overflow-x: auto; }
.board-tab {
  padding: 12px 18px; border: none; background: transparent;
  color: var(--text-secondary); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
  border-bottom: 2px solid transparent; position: relative;
}
.board-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
.board-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); font-weight: 600; }
.board-tab .tab-key { font-size: 10px; background: rgba(79, 195, 247, 0.15); color: var(--accent-blue); padding: 1px 5px; border-radius: 3px; margin-right: 6px; font-weight: 700; }

/* 全屏按钮 */
.fullscreen-btn {
  padding: 8px 14px; border: 1px solid rgba(79, 195, 247, 0.3); border-radius: 6px;
  background: rgba(79, 195, 247, 0.08); color: var(--accent-blue);
  font-size: 16px; cursor: pointer; transition: all 0.3s; margin-left: 12px; white-space: nowrap;
}
.fullscreen-btn:hover { background: rgba(79, 195, 247, 0.2); }

/* ===== 主内容区 ===== */
.main-content { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 32px 32px; }

/* ===== KPI 概览区 ===== */
.kpi-overview {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px;
}
@media (max-width: 1024px) { .kpi-overview { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 640px) { .kpi-overview { grid-template-columns: repeat(2, 1fr); } }

.kpi-item {
  background: var(--bg-card); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 20px 16px; text-align: center;
  position: relative; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s;
}
.kpi-item:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.kpi-item::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-item:nth-child(1)::before { background: var(--accent-blue); }
.kpi-item:nth-child(2)::before { background: var(--accent-orange); }
.kpi-item:nth-child(3)::before { background: var(--accent-green); }
.kpi-item:nth-child(4)::before { background: var(--accent-red); }
.kpi-item:nth-child(5)::before { background: var(--accent-cyan); }
.kpi-item:nth-child(6)::before { background: var(--accent-purple); }
.kpi-icon { font-size: 24px; margin-bottom: 8px; }
.kpi-value { font-size: 32px; font-weight: 800; line-height: 1.1; }
.kpi-item:nth-child(1) .kpi-value { color: var(--accent-blue); }
.kpi-item:nth-child(2) .kpi-value { color: var(--accent-orange); }
.kpi-item:nth-child(3) .kpi-value { color: var(--accent-green); }
.kpi-item:nth-child(4) .kpi-value { color: var(--accent-red); }
.kpi-item:nth-child(5) .kpi-value { color: var(--accent-cyan); }
.kpi-item:nth-child(6) .kpi-value { color: var(--accent-purple); }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-weight: 500; }
.kpi-trend { font-size: 11px; margin-top: 4px; font-weight: 600; }
.kpi-trend.down { color: var(--accent-green); }
.kpi-trend.up { color: var(--accent-red); }
.kpi-trend.flat { color: var(--text-secondary); }

/* ===== 欢迎区 ===== */
.welcome-section { text-align: center; margin-bottom: 28px; }
.welcome-section h2 { font-size: 18px; color: var(--text-secondary); font-weight: 400; }

/* ===== 卡片网格 ===== */
.dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 1024px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .dashboard-grid { grid-template-columns: 1fr; } }

/* ===== 看板卡片 ===== */
.dashboard-card {
  position: relative; background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px;
  padding: 28px 24px; cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
}
.dashboard-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-accent); opacity: 0.8; transition: height 0.3s; }
.dashboard-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 0%, var(--card-glow) 0%, transparent 70%); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
.dashboard-card:hover { transform: translateY(-6px) scale(1.02); border-color: var(--card-accent); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 30px var(--card-glow); }
.dashboard-card:hover::before { height: 4px; opacity: 1; }
.dashboard-card:hover::after { opacity: 1; }

.card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
.card-icon { font-size: 36px; filter: drop-shadow(0 0 8px var(--card-glow)); }
.card-status {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap;
}
.card-status.ok { background: rgba(105, 240, 174, 0.15); color: var(--accent-green); }
.card-status.warn { background: rgba(255, 82, 82, 0.15); color: var(--accent-red); }
.card-status.info { background: rgba(79, 195, 247, 0.15); color: var(--accent-blue); }

.card-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
.card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
.card-update { font-size: 11px; color: var(--text-secondary); opacity: 0.7; }
.card-shortcut { font-size: 11px; color: var(--text-secondary); opacity: 0.5; }
.card-shortcut kbd { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; }

.card-arrow { position: absolute; bottom: 16px; right: 16px; font-size: 16px; color: var(--text-secondary); opacity: 0; transform: translateX(-10px); transition: all 0.3s; }
.dashboard-card:hover .card-arrow { opacity: 1; transform: translateX(0); color: var(--card-accent); }

/* ===== Loading 动画 ===== */
.loading-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-primary); display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; z-index: 5;
}
.loading-overlay.show { display: flex; }
.loading-spinner {
  width: 40px; height: 40px; border: 3px solid rgba(79, 195, 247, 0.2);
  border-top-color: var(--accent-blue); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-secondary); }

/* ===== iframe 容器 ===== */
.iframe-container {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100; background: var(--bg-primary);
}
.iframe-container.show { display: block; }
.iframe-wrapper { position: relative; width: 100%; height: calc(100% - 48px); margin-top: 48px; }
.iframe-wrapper iframe { width: 100%; height: 100%; border: none; }

/* ===== 悬浮返回按钮 ===== */
.floating-back-btn {
  position: fixed; bottom: 30px; right: 30px; z-index: 1000;
  padding: 14px 28px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border: none; border-radius: 30px; color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 20px var(--glow-blue); transition: all 0.3s;
  display: none; align-items: center; gap: 8px;
}
.floating-back-btn.show { display: flex; }
.floating-back-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 30px var(--glow-blue); }

/* ===== 底部 ===== */
.footer {
  position: relative; z-index: 1; text-align: center; padding: 24px;
  color: var(--text-secondary); font-size: 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 60px;
}

/* ===== 粒子动画 ===== */
.particles { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle { position: absolute; width: 2px; height: 2px; background: var(--accent-blue); border-radius: 50%; opacity: 0.3; animation: float linear infinite; }
@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
}

/* ===== 轮播指示器 ===== */
.carousel-indicator {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(17, 22, 56, 0.9); border: 1px solid rgba(79, 195, 247, 0.2);
  border-radius: 20px; padding: 8px 16px; display: none; align-items: center; gap: 12px;
  z-index: 1000; font-size: 12px; color: var(--text-secondary);
}
.carousel-indicator.show { display: flex; }
.carousel-indicator .progress-bar {
  width: 100px; height: 3px; background: rgba(79, 195, 247, 0.2); border-radius: 2px; overflow: hidden;
}
.carousel-indicator .progress-fill {
  height: 100%; background: var(--accent-blue); border-radius: 2px;
  animation: progress 30s linear infinite;
}
@keyframes progress { from { width: 0; } to { width: 100%; } }

</style>
</head>

                <div class="section-body visible"><div class="section-inner"><div class="chart-box"><div class="chart-title" id="sj-monthlyChartTitle">周度修改份数统计（技术/非技术）</div><canvas id="sj-monthlyChart"></canvas></div></div></div>

            <div class="section">
                <div class="section-title" onclick="sj_toggleSection(this)"><span><i class="fas fa-users"></i> 责任分析</span><span class="toggle-icon">▼</span></div>
                <div class="section-body visible"><div class="section-inner"><p style="color:#666;margin-bottom:15px;"><i class="fas fa-info-circle"></i> 点击部门行可展开查看人员明细</p><table class="std-table"><thead><tr><th>部门 / 责任人</th><th>修改单数</th><th>修改份数</th><th>技术份数</th><th>技术工时(h)</th><th>非技术份数</th><th>非技术工时(h)</th><th>总工时(h)</th></tr></thead><tbody id="sj-deptTableBody"></tbody></table></div></div>
            </div>
            <div class="section">
                <div class="section-title" onclick="sj_toggleSection(this)"><span><i class="fas fa-clock"></i> 工时统计（按责任人）</span><span class="toggle-icon">▼</span></div>
                <div class="section-body visible"><div class="section-inner"><div class="chart-box"><div class="chart-title">个人工时排名（技术 / 非技术）</div><canvas id="sj-personChart"></canvas></div></div></div>
            </div>
            <div class="section">
                <div class="section-title" onclick="sj_toggleSection(this)"><span><i class="fas fa-list-alt"></i> 可统计明细表</span><span class="toggle-icon">▼</span></div>
                <div class="section-body visible"><div class="section-inner"><div class="detail-wrap"><table class="std-table" id="sj-detailTable"><thead><tr><th>文件编号</th><th>责任人</th><th>部门</th><th>发布日期</th><th>修改份数</th><th>技术份数</th><th>技术工时(h)</th><th>非技术份数</th><th>非技术工时(h)</th><th>总工时(h)</th></tr></thead><tbody id="sj-detailTableBody"></tbody></table></div></div></div>
            </div>

        <div class="footer"><p><i class="fas fa-info-circle"></i> 报告生成时间：<span id="sj-updateTime"></span></p></div>
    </div>

    <div class="toast" id="sj-toast"></div>

    
</div></div></section>
<!-- ===== 不合格报告 看板（内联合并） ===== -->

<script>
window.__dsher = window.__dsher || {};
(function(){
(function(){ // ---- 设计修改单 ----
// ============================================================
    // Toast 提示函数
    // ============================================================
    function sj_showToast(msg) {
        var t = document.getElementById('sj-toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
    }

    // ============================================================
    // 提取月份函数
    // ============================================================
    function extractMonth(dateStr) {
        if (!dateStr) return '';
        var t = String(dateStr).trim();
        var match = t.match(/^(\d{4})(\d{2})$/);          // 202601
        if (match && +match[2] >= 1 && +match[2] <= 12) return match[1] + '-' + String(+match[2]).padStart(2, '0');
        match = t.match(/^(\d{4})(\d{2})(\d{2})$/);       // 20260105
        if (match && +match[2] >= 1 && +match[2] <= 12) return match[1] + '-' + String(+match[2]).padStart(2, '0');
        match = t.match(/^(\d{4})\.(\d{1,2})(?:\.(\d{1,2}))?$/); // 2026.1 / 2026.1.5
        if (match && +match[2] >= 1 && +match[2] <= 12) return match[1] + '-' + String(+match[2]).padStart(2, '0');
        match = dateStr.match(/(\d{4})-(\d{1,2})/);
        if (match) return match[1] + '-' + match[2].padStart(2, '0');
        match = dateStr.match(/(\d{4})年\s*(\d{1,2})月/);
        if (match) return match[1] + '-' + match[2].padStart(2, '0');
        match = dateStr.match(/(\d{4})[-\/年]\s*(\d{1,2})[-\/月]\s*(\d{1,2})/);
        if (match) return match[1] + '-' + match[2].padStart(2, '0');
        match = dateStr.match(/(\d{4})-\s*(\d{1,2})\s*月/);
        if (match) return match[1] + '-' + match[2].padStart(2, '0');
        var d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        }
        return '';
    }

    // ============================================================
    // 周次提取函数（ISO 8601 周）
    // ============================================================
    function parseDateParts(dateStr) {
        if (!dateStr) return null;
        var m, t = String(dateStr).trim();
        // 格式0：20260105（八位纯数字）
        m = t.match(/^(\d{4})(\d{2})(\d{2})$/);
        if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
        // 格式1：2026-1 月-05 20:20
        m = dateStr.match(/(\d{4})-(\d{1,2})\s*月-(\d{1,2})/);
        if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
        // 格式2：2026-01-05 / 2026/1/5
        m = dateStr.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
        if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
        // 格式3：2026年1月5日
        m = dateStr.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);
        if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
        var dt = new Date(dateStr);
        if (!isNaN(dt.getTime())) return { y: dt.getFullYear(), mo: dt.getMonth() + 1, d: dt.getDate() };
        return null;
    }

    function extractWeek(dateStr) {
        var p = parseDateParts(dateStr);
        if (!p) return '';
        var date = new Date(Date.UTC(p.y, p.mo - 1, p.d));
        var day = date.getUTCDay() || 7; // 周日=7，周一=1
        date.setUTCDate(date.getUTCDate() + 4 - day); // 定位到本周四
        var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
        var weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        return date.getUTCFullYear() + '-W' + String(weekNo).padStart(2, '0');
    }

    function weekLabel(wk) {
        var parts = wk.split('-W');
        if (parts.length === 2) return parts[0] + '年第' + parseInt(parts[1], 10) + '周';
        return wk;
    }

    // ============================================================
    // 极简内置示例数据（仅3条）
    // ============================================================
    var DEFAULT_DETAIL_LIST = [
        {"文件编号":"DEMO-001","责任人":"张三","部门":"机械部","发布日期":"2026-01-01","修改份数":2,"技术份数":2,"技术工时":1.5,"非技术份数":0,"非技术工时":0,"总工时":1.5},
        {"文件编号":"DEMO-002","责任人":"李四","部门":"电控部","发布日期":"2026-02-01","修改份数":1,"技术份数":0,"技术工时":0,"非技术份数":1,"非技术工时":0.5,"总工时":0.5},
        {"文件编号":"DEMO-003","责任人":"王五","部门":"机械部","发布日期":"2026-03-01","修改份数":3,"技术份数":3,"技术工时":2.0,"非技术份数":0,"非技术工时":0,"总工时":2.0}
    ];

    // ============================================================
    // 实际使用的数据
    // ============================================================
    var detailList = [];

    // 优先加载外部数据（如果存在）
    if (typeof RAW_SHEJI !== 'undefined' && Array.isArray(RAW_SHEJI) && RAW_SHEJI.length > 0) {
        detailList = RAW_SHEJI;
    } else {
        var saved = localStorage.getItem('sheji_data');
        if (saved) {
            try {
                var parsed = JSON.parse(saved);
                if (parsed && Array.isArray(parsed) && parsed.length > 0) {
                    detailList = parsed;
                }
            } catch(e) {}
        }
    }
    if (!detailList || detailList.length === 0) {
        detailList = JSON.parse(JSON.stringify(DEFAULT_DETAIL_LIST));
    }

    // ============================================================
    // 聚合计算
    // ============================================================
    function computeAggregates(list) {
        var overview = {
            totalOrders: 0,
            totalItems: 0,
            totalHours: 0,
            totalTechItems: 0,
            totalTechHours: 0,
            totalNontechItems: 0,
            totalNontechHours: 0
        };
        var weekly = {};
        var deptStats = {};
        var deptPerson = {};
        var personHours = {};

        list.forEach(function(d) {
            var copies = parseInt(d['修改份数']) || 0;
            var techCopies = parseInt(d['技术份数']) || 0;
            var techHours = parseFloat(d['技术工时']) || 0;
            var nontechCopies = parseInt(d['非技术份数']) || 0;
            var nontechHours = parseFloat(d['非技术工时']) || 0;
            var totalHours = techHours + nontechHours;
            var week = d['周次'] || extractWeek(d['发布日期']) || '';
            var dept = d['部门'] || '未分类';
            var person = d['责任人'] || '未知';

            overview.totalOrders++;
            overview.totalItems += copies;
            overview.totalHours += totalHours;
            overview.totalTechItems += techCopies;
            overview.totalTechHours += techHours;
            overview.totalNontechItems += nontechCopies;
            overview.totalNontechHours += nontechHours;

            if (week) {
                if (!weekly[week]) weekly[week] = {修改单数:0,修改份数:0,技术份数:0,技术工时:0,非技术份数:0,非技术工时:0};
                weekly[week].修改单数++;
                weekly[week].修改份数 += copies;
                weekly[week].技术份数 += techCopies;
                weekly[week].技术工时 += techHours;
                weekly[week].非技术份数 += nontechCopies;
                weekly[week].非技术工时 += nontechHours;
            }

            if (!deptStats[dept]) deptStats[dept] = {修改单数:0,修改份数:0,技术份数:0,技术工时:0,非技术份数:0,非技术工时:0,总工时:0};
            deptStats[dept].修改单数++;
            deptStats[dept].修改份数 += copies;
            deptStats[dept].技术份数 += techCopies;
            deptStats[dept].技术工时 += techHours;
            deptStats[dept].非技术份数 += nontechCopies;
            deptStats[dept].非技术工时 += nontechHours;
            deptStats[dept].总工时 += totalHours;

            if (!deptPerson[dept]) deptPerson[dept] = {};
            if (!deptPerson[dept][person]) deptPerson[dept][person] = {修改单数:0,修改份数:0,技术份数:0,技术工时:0,非技术份数:0,非技术工时:0,总工时:0};
            deptPerson[dept][person].修改单数++;
            deptPerson[dept][person].修改份数 += copies;
            deptPerson[dept][person].技术份数 += techCopies;
            deptPerson[dept][person].技术工时 += techHours;
            deptPerson[dept][person].非技术份数 += nontechCopies;
            deptPerson[dept][person].非技术工时 += nontechHours;
            deptPerson[dept][person].总工时 += totalHours;

            if (!personHours[person]) personHours[person] = {部门:dept,修改单数:0,修改份数:0,技术份数:0,技术工时:0,非技术份数:0,非技术工时:0,总工时:0};
            personHours[person].修改单数++;
            personHours[person].修改份数 += copies;
            personHours[person].技术份数 += techCopies;
            personHours[person].技术工时 += techHours;
            personHours[person].非技术份数 += nontechCopies;
            personHours[person].非技术工时 += nontechHours;
            personHours[person].总工时 += totalHours;
        });

        return { overview: overview, weekly: weekly, deptStats: deptStats, deptPerson: deptPerson, personHours: personHours, detailList: list };
    }

    var RAW = computeAggregates(detailList);

    // ============================================================
    // 保存到 localStorage
    // ============================================================
    function sj_saveToStorageSheji() {
        localStorage.setItem('sheji_data', JSON.stringify(RAW.detailList));
        sj_showToast('✅ 数据已保存到浏览器！');
    }

    // ============================================================
    // 渲染控制
    // ============================================================
    var weeklyChart = null, personChart = null;
    var currentWeek = 'all';

    // ★ 周度趋势图始终使用全量数据
    function renderWeeklyStatic() {
        var weekly = RAW.weekly;
        var weeks = Object.keys(weekly).sort();
        var ctx = document.getElementById('sj-monthlyChart').getContext('2d');

        document.getElementById('sj-monthlyChartTitle').textContent = '周度修改份数统计（技术/非技术）';

        if (weeks.length === 0) {
            if (weeklyChart) { weeklyChart.destroy(); weeklyChart = null; }
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.font = '16px Microsoft YaHei';
            ctx.fillStyle = '#999';
            ctx.textAlign = 'center';
            ctx.fillText('暂无数据', ctx.canvas.width / 2, ctx.canvas.height / 2);
            return;
        }

        var techItems = weeks.map(function(w) { return weekly[w]['技术份数'] || 0; });
        var nontechItems = weeks.map(function(w) { return weekly[w]['非技术份数'] || 0; });
        var totalItems = weeks.map(function(w) { return (weekly[w]['技术份数'] || 0) + (weekly[w]['非技术份数'] || 0); });

        if (weeklyChart) { weeklyChart.destroy(); weeklyChart = null; }

        weeklyChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: weeks.map(function(w) { return weekLabel(w); }),
                datasets: [
                    { label: '技术份数', data: techItems, backgroundColor: '#28a745', stack: 'stack1', order: 2 },
                    { label: '非技术份数', data: nontechItems, backgroundColor: '#e8834a', stack: 'stack1', order: 2 },
                    { label: '总修改份数', data: totalItems, type: 'line', borderColor: '#4a7fc4', backgroundColor: 'rgba(74,127,196,0.1)', borderWidth: 3, pointBackgroundColor: '#4a7fc4', pointBorderColor: '#fff', pointBorderWidth: 2, pointRadius: 6, pointHoverRadius: 8, fill: false, tension: 0.3, order: 1 }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                var label = context.dataset.label || '';
                                if (label) label += ': ';
                                if (context.parsed.y !== null) label += context.parsed.y + ' 份';
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: { stacked: true, title: { display: true, text: '周次' } },
                    y: { stacked: true, beginAtZero: true, title: { display: true, text: '份数' } }
                }
            }
        });
    }

    function sj_populateWeekFilter() {
        var sel = document.getElementById('sj-monthFilter');
        if (!sel) return;
        var prev = sel.value;
        var weeks = {};
        RAW.detailList.forEach(function(d) {
            var wk = d['周次'] || extractWeek(d['发布日期']) || '';
            if (wk) weeks[wk] = true;
        });
        var keys = Object.keys(weeks).sort();
        var html = '<option value="all">全部周次</option>';
        keys.forEach(function(w) { html += '<option value="' + w + '">' + weekLabel(w) + '</option>'; });
        sel.innerHTML = html;
        if (keys.indexOf(prev) !== -1) sel.value = prev;
    }

    function sj_applyFilter() {
        sj_populateWeekFilter();
        currentWeek = document.getElementById('sj-monthFilter').value;

        var filteredList;
        if (currentWeek === 'all') {
            filteredList = RAW.detailList;
        } else {
            filteredList = RAW.detailList.filter(function(d) {
                var w = d['周次'] || extractWeek(d['发布日期']) || '';
                return w === currentWeek;
            });
        }

        var filteredData = computeAggregates(filteredList);

        // 周度趋势图固定使用全量数据
        try { renderWeeklyStatic(); } catch(e){ window.__chartLibFallback && window.__chartLibFallback(); }

        // 其他部分使用筛选后的数据
        updateStats(filteredData.overview);
        renderDept(filteredData.deptStats, filteredData.deptPerson);
        try { renderPerson(filteredData.personHours); } catch(e){ window.__chartLibFallback && window.__chartLibFallback(); }
        renderDetail(filteredData.detailList);
    }

    function updateStats(ov) {
        document.getElementById('sj-totalOrders').textContent = ov.totalOrders;
        document.getElementById('sj-totalItems').textContent = ov.totalItems;
        document.getElementById('sj-totalHours').textContent = ov.totalHours.toFixed(2);
        document.getElementById('sj-techItems').textContent = ov.totalTechItems;
        document.getElementById('sj-techHours').textContent = ov.totalTechHours.toFixed(2) + 'h';
        document.getElementById('sj-nontechItems').textContent = ov.totalNontechItems;
        document.getElementById('sj-nontechHours').textContent = ov.totalNontechHours.toFixed(2) + 'h';
        document.getElementById('sj-techCount').textContent = ov.totalTechItems;
        document.getElementById('sj-techHoursSub').textContent = ov.totalTechHours.toFixed(2) + ' 小时';
        document.getElementById('sj-nontechCount').textContent = ov.totalNontechItems;
        document.getElementById('sj-nontechHoursSub').textContent = ov.totalNontechHours.toFixed(2) + ' 小时';
        document.getElementById('sj-dataCount').textContent = ov.totalOrders;
    }

    function renderDept(deptStats, deptPerson) {
        var tbody = document.getElementById('sj-deptTableBody');
        tbody.innerHTML = '';
        Object.keys(deptStats).sort().forEach(function(dept) {
            var s = deptStats[dept];
            var tr = document.createElement('tr');
            tr.className = 'dept-row';
            tr.innerHTML = '<td><span class="expand-icon" id="icon-'+dept+'">▶</span>'+dept+'</td><td>'+s['修改单数']+'</td><td>'+s['修改份数']+'</td><td class="tech-tag">'+s['技术份数']+'</td><td class="tech-tag">'+s['技术工时'].toFixed(2)+'</td><td class="nontech-tag">'+s['非技术份数']+'</td><td class="nontech-tag">'+s['非技术工时'].toFixed(2)+'</td><td><b>'+s['总工时'].toFixed(2)+'</b></td>';
            tr.onclick = (function(d){ return function(){ toggleDept(d); }; })(dept);
            tbody.appendChild(tr);
            var persons = deptPerson[dept] || {};
            Object.entries(persons).sort(function(a,b) { return b[1]['总工时'] - a[1]['总工时']; }).forEach(function(entry) {
                var name = entry[0], ps = entry[1];
                var ptr = document.createElement('tr');
                ptr.className = 'person-row';
                ptr.id = 'row-'+dept+'-'+name;
                ptr.innerHTML = '<td>'+name+'</td><td>'+ps['修改单数']+'</td><td>'+ps['修改份数']+'</td><td class="tech-tag">'+ps['技术份数']+'</td><td class="tech-tag">'+ps['技术工时'].toFixed(2)+'</td><td class="nontech-tag">'+ps['非技术份数']+'</td><td class="nontech-tag">'+ps['非技术工时'].toFixed(2)+'</td><td>'+ps['总工时'].toFixed(2)+'</td>';
                tbody.appendChild(ptr);
            });
        });
    }

    function toggleDept(dept) {
        var icon = document.getElementById('icon-'+dept);
        var rows = document.querySelectorAll('[id^="row-'+dept+'-"]');
        var exp = icon.classList.contains('rotated');
        if (exp) { icon.classList.remove('rotated'); rows.forEach(function(r){ r.classList.remove('show'); }); }
        else { icon.classList.add('rotated'); rows.forEach(function(r){ r.classList.add('show'); }); }
    }

    function renderPerson(personHours) {
        var sorted = Object.entries(personHours).sort(function(a,b) { return b[1]['总工时'] - a[1]['总工时']; });
        var ctx = document.getElementById('sj-personChart').getContext('2d');

        if (personChart) { personChart.destroy(); personChart = null; }

        if (sorted.length === 0) {
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.font = '16px Microsoft YaHei';
            ctx.fillStyle = '#999';
            ctx.textAlign = 'center';
            ctx.fillText('当前筛选周次无数据', ctx.canvas.width/2, ctx.canvas.height/2);
        } else {
            personChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(function(s){ return s[0]; }),
                    datasets: [
                        { label: '技术工时', data: sorted.map(function(s){ return s[1]['技术工时']; }), backgroundColor: '#4a7fc4' },
                        { label: '非技术工时', data: sorted.map(function(s){ return s[1]['非技术工时']; }), backgroundColor: '#e8834a' }
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: { legend: { position: 'top' } },
                    scales: { x: { beginAtZero: true, stacked: true, title: { display: true, text: '工时(h)' } }, y: { stacked: true } }
                }
            });
        }
    }

    function renderDetail(detailList) {
        var tbody = document.getElementById('sj-detailTableBody');
        tbody.innerHTML = '';
        detailList.forEach(function(d) {
            var techHours = parseFloat(d['技术工时']) || 0;
            var nontechHours = parseFloat(d['非技术工时']) || 0;
            var totalHours = parseFloat(d['总工时']) || 0;
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>'+d['文件编号']+'</td><td>'+d['责任人']+'</td><td>'+d['部门']+'</td><td>'+d['发布日期']+'</td><td>'+d['修改份数']+'</td><td class="tech-tag">'+d['技术份数']+'</td><td class="tech-tag">'+techHours.toFixed(2)+'</td><td class="nontech-tag">'+d['非技术份数']+'</td><td class="nontech-tag">'+nontechHours.toFixed(2)+'</td><td><b>'+totalHours.toFixed(2)+'</b></td>';
            tbody.appendChild(tr);
        });
    }

    // ============================================================
    // 一键导入（Excel 和 JSON）
    // ============================================================
    function sj_importExcelSheji(event) {
        var file = event.target.files[0];
        if (!file) return;

        var ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'json') {
            var reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    var imported = JSON.parse(ev.target.result);
                    if (!imported || !Array.isArray(imported)) {
                        alert('JSON 格式错误：需要数组格式！');
                        return;
                    }
                    if (confirm('确定要导入 ' + imported.length + ' 条数据吗？这将覆盖现有数据！')) {
                        window._lastImport = JSON.parse(JSON.stringify(RAW.detailList));
                        RAW.detailList = imported.map(function(row) {
                            return {
                                '文件编号': row['文件编号'] || '',
                                '责任人': row['责任人'] || '',
                                '部门': row['部门'] || '',
                                '发布日期': row['发布日期'] || '',
                                '修改份数': parseInt(row['修改份数']) || 0,
                                '技术份数': parseInt(row['技术份数']) || 0,
                                '技术工时': parseFloat(row['技术工时']) || 0,
                                '非技术份数': parseInt(row['非技术份数']) || 0,
                                '非技术工时': parseFloat(row['非技术工时']) || 0,
                                '总工时': (parseFloat(row['技术工时']) || 0) + (parseFloat(row['非技术工时']) || 0)
                            };
                        });
                        RAW = computeAggregates(RAW.detailList);
                        sj_saveToStorageSheji();
                        sj_applyFilter();
                        sj_showToast('✅ 导入成功！共 ' + RAW.detailList.length + ' 条数据。');
                    }
                } catch(err) { alert('JSON 导入失败：' + err.message); }
            };
            reader.readAsText(file);
            event.target.value = '';
            return;
        }

        // Excel 导入
        var reader = new FileReader();
        reader.onload = function(ev) {
            try {
                var data = new Uint8Array(ev.target.result);
                var wb = XLSX.read(data, { type: 'array' });
                var ws = wb.Sheets[wb.SheetNames[0]];
                var json = XLSX.utils.sheet_to_json(ws, { defval: '' });
                if (json.length === 0) { alert('文件为空或格式错误！'); return; }
                var newList = json.map(function(row) {
                    return {
                        '文件编号': row['文件编号'] || '',
                        '责任人': row['责任人'] || '',
                        '部门': row['部门'] || '',
                        '发布日期': row['发布日期'] || '',
                        '修改份数': parseInt(row['修改份数']) || 0,
                        '技术份数': parseInt(row['技术份数']) || 0,
                        '技术工时': parseFloat(row['技术工时']) || 0,
                        '非技术份数': parseInt(row['非技术份数']) || 0,
                        '非技术工时': parseFloat(row['非技术工时']) || 0,
                        '总工时': (parseFloat(row['技术工时']) || 0) + (parseFloat(row['非技术工时']) || 0)
                    };
                });
                if (newList.length === 0) { alert('未找到有效数据行！'); return; }
                if (confirm('确定要导入 ' + newList.length + ' 条数据吗？这将覆盖现有数据！')) {
                    window._lastImport = JSON.parse(JSON.stringify(RAW.detailList));
                    RAW.detailList = newList;
                    RAW = computeAggregates(RAW.detailList);
                    sj_saveToStorageSheji();
                    sj_applyFilter();
                    sj_showToast('✅ 导入成功！共 ' + newList.length + ' 条数据。');
                }
            } catch(err) { alert('导入失败：' + err.message); }
        };
        reader.readAsArrayBuffer(file);
        event.target.value = '';
    }

    function sj_undoImportSheji() {
        if (window._lastImport) {
            if (confirm('撤回导入，恢复之前的数据？')) {
                RAW.detailList = window._lastImport;
                RAW = computeAggregates(RAW.detailList);
                sj_saveToStorageSheji();
                sj_applyFilter();
                window._lastImport = null;
                sj_showToast('✅ 已撤回导入！');
            }
        } else {
            sj_showToast('⚠️ 没有可撤回的导入操作。');
        }
    }

    function sj_resetToDefaultSheji() {
        if (confirm('确定要重置为默认数据吗？所有修改将被清除！')) {
            localStorage.removeItem('sheji_data');
            RAW.detailList = JSON.parse(JSON.stringify(DEFAULT_DETAIL_LIST));
            RAW = computeAggregates(RAW.detailList);
            sj_saveToStorageSheji();
            sj_applyFilter();
            sj_showToast('✅ 已重置为默认数据！');
        }
    }

    function sj_clearDataSheji() {
        if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
            RAW.detailList = [];
            RAW = computeAggregates(RAW.detailList);
            localStorage.removeItem('sheji_data');
            sj_applyFilter();
            sj_showToast('✅ 数据已清空！');
        }
    }

    function sj_exportExcelSheji() {
        var headers = ['文件编号','责任人','部门','发布日期','修改份数','技术份数','技术工时','非技术份数','非技术工时','总工时'];
        var wsData = [headers];
        RAW.detailList.forEach(function(row) {
            var rowData = headers.map(function(h) { return row[h] || ''; });
            wsData.push(rowData);
        });
        var ws = XLSX.utils.aoa_to_sheet(wsData);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '设计修改单');
        XLSX.writeFile(wb, '设计修改单看板数据_' + new Date().toISOString().slice(0,10) + '.xlsx');
        sj_showToast('✅ Excel 导出成功！');
    }

    // ============================================================
    // ★★★ 一键生成含最新数据的 HTML（自包含，无外部引用） ★★★
    // ============================================================
    function sj_exportHtmlWithDataSheji() {
        // 获取当前数据
        var dataJson = JSON.stringify(RAW.detailList, null, 2);

        // 获取当前页面 HTML 结构
        var htmlContent = document.documentElement.outerHTML;

        // 1. 替换内置示例数据
        htmlContent = htmlContent.replace(
            /var DEFAULT_DETAIL_LIST = \[[\s\S]*?\];/,
            'var DEFAULT_DETAIL_LIST = ' + dataJson + ';'
        );

        // 2. 移除外部数据引用（删除 <script src="设计修改单数据.data.js"> 这行）
        htmlContent = htmlContent.replace(
            /<script src="设计修改单数据\.data\.js"><\/script>\s*/,
            ''
        );

        // 3. 修改数据初始化逻辑，直接使用 DEFAULT_DETAIL_LIST（不再尝试加载外部数据）
        var newInitCode = `
        // ★ 导出版本：完全自包含，不依赖外部文件
        var saved = localStorage.getItem('sheji_data');
        if (saved) {
            try {
                var parsed = JSON.parse(saved);
                if (parsed && Array.isArray(parsed) && parsed.length > 0) {
                    detailList = parsed;
                } else {
                    detailList = JSON.parse(JSON.stringify(DEFAULT_DETAIL_LIST));
                }
            } catch(e) {
                detailList = JSON.parse(JSON.stringify(DEFAULT_DETAIL_LIST));
            }
        } else {
            detailList = JSON.parse(JSON.stringify(DEFAULT_DETAIL_LIST));
        }`;

        // 替换初始化代码块
        var initRegex = /var detailList = \[\];\s*\/\/ 优先加载外部数据[\s\S]*?if \(!detailList \|\| detailList\.length === 0\) \{[\s\S]*?\}/;
        htmlContent = htmlContent.replace(initRegex, 'var detailList = [];\n' + newInitCode);

        // 4. 生成 Blob 并下载
        var blob = new Blob(['<!DOCTYPE html>\n' + htmlContent], { type: 'text/html;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '设计修改单看板_含数据_' + new Date().toISOString().slice(0,10) + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        sj_showToast('✅ HTML 已导出，包含 ' + RAW.detailList.length + ' 条数据！');
    }

    // ============================================================
    // ★★★ 折叠/展开功能 ★★★
    // ============================================================
    function sj_toggleSection(titleEl) {
        var body = titleEl.nextElementSibling;
        if (body.classList.contains('hidden')) {
            body.classList.remove('hidden');
            body.classList.add('visible');
            titleEl.classList.remove('collapsed');
            body.style.maxHeight = body.scrollHeight + 5000 + 'px';
        } else {
            body.classList.add('hidden');
            body.classList.remove('visible');
            titleEl.classList.add('collapsed');
        }
    }

    // ============================================================
    // ★★★ 暴露全局函数供 HTML 调用 ★★★
    // ============================================================
    window.sj_toggleSection = sj_toggleSection;
    window.sj_applyFilter = sj_applyFilter;
    window.sj_importExcelSheji = sj_importExcelSheji;
    window.sj_undoImportSheji = sj_undoImportSheji;
    window.sj_resetToDefaultSheji = sj_resetToDefaultSheji;
    window.sj_clearDataSheji = sj_clearDataSheji;
    window.sj_saveToStorageSheji = sj_saveToStorageSheji;
    window.sj_exportExcelSheji = sj_exportExcelSheji;
    window.sj_exportHtmlWithDataSheji = sj_exportHtmlWithDataSheji;
    window.sj_showToast = sj_showToast;

    // ============================================================
    // 初始化
    // ============================================================

  // 暴露全局函数供 HTML onclick 调用（缺失函数自动跳过）
  window["sj_exportExcelSheji"]=sj_exportExcelSheji;
  window["sj_exportHtmlWithDataSheji"]=sj_exportHtmlWithDataSheji;
  window["sj_saveToStorageSheji"]=sj_saveToStorageSheji;
  window["sj_showToast"]=sj_showToast;
  window["sj_undoImportSheji"]=sj_undoImportSheji;
  window["sj_resetToDefaultSheji"]=sj_resetToDefaultSheji;
  window["sj_clearDataSheji"]=sj_clearDataSheji;
  window["sj_toggleSection"]=sj_toggleSection;
  window["sj_applyFilter"]=sj_applyFilter;
  window["sj_importExcelSheji"]=sj_importExcelSheji;
  window["importExcelSheji"]=sj_importExcelSheji;

  window.__dsher["sj"]={done:false,init:function(){sj_applyFilter();
sj_saveToStorageSheji();
        document.getElementById('sj-updateTime').textContent = new Date().toLocaleString('zh-CN');
        document.querySelectorAll('.section-body.visible').forEach(function(el) {
            el.style.maxHeight = el.scrollHeight + 5000 + 'px';
        });
 window.__dsher["sj"].done=true;}};
})();
})();
</script>

<script>
window.__chartLibFallback = window.__chartLibFallback || function() {};
(function(){
  function b64ToBytes(b64){var bin=atob(b64);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++){u[i]=bin.charCodeAt(i);}return u;}
  async function unpack(b64){
    var bytes=b64ToBytes(b64);
    var ds=new DecompressionStream('gzip');
    var stream=new Blob([bytes]).stream().pipeThrough(ds);
    var ab=await new Response(stream).arrayBuffer();
    return new TextDecoder().decode(ab);
  }
  window.__DSH_BOOT = async function(){
    try{
      if(window.__DSH_LIB_B64){var libsrc=await unpack(window.__DSH_LIB_B64);(0,eval)(libsrc);}
      if(window.__DSH_DATA_B64){var datasrc=await unpack(window.__DSH_DATA_B64);(0,eval)(datasrc);}
    }catch(e){console.error('解压失败',e);var bar=document.createElement('div');bar.style.cssText='position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:8px;z-index:99999;font-size:13px;text-align:center;';bar.textContent='⚠️ 图表库解压失败: '+e.message;document.body.appendChild(bar);}
    try{ window.__dsher["sj"].init(); }catch(e){ console.error('看板初始化失败',e); var bar=document.createElement('div'); bar.style.cssText='position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:8px;z-index:99999;font-size:13px;text-align:center;'; bar.textContent='⚠️ 初始化失败: '+e.message; document.body.appendChild(bar); }
  };
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){window.__DSH_BOOT();});}
  else{window.__DSH_BOOT();}
})();
</script>
